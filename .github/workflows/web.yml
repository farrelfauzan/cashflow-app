name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "api/openapi.yaml"
      - ".github/workflows/web.yml"
      # The e2e job runs against the real API, started from these.
      - "services/api/**"
      - "infra/compose.dev.yaml"
  pull_request:
    paths:
      - "apps/web/**"
      - "api/openapi.yaml"
      - ".github/workflows/web.yml"
      # The e2e job runs against the real API, started from these.
      - "services/api/**"
      - "infra/compose.dev.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        run: pnpm gen:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Playwright at both sizes against the real Go API: throwaway PostgreSQL and Redis from the
  # dev compose file, migrated and seeded with seed-demo and generate-invoices, WhatsApp on devlog (nothing is sent).
  # The login helper reads codes from DEVLOG_FILE.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      E2E_DIR: /tmp/cashflow-e2e
      # The roles and passwords from services/api/db/init and infra/compose.dev.yaml.
      MIGRATE_DATABASE_URL: postgres://cashflow_owner:owner-dev-password@127.0.0.1:5432/cashflow?sslmode=disable
      DATABASE_URL: postgres://cashflow_app:cashflow_app_dev@127.0.0.1:5432/cashflow?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      HTTP_ADDR: 127.0.0.1:8080
      AUTH_SECRET: e2e-only-auth-secret-not-used-anywhere-else
      # Encrypts per-organization secrets. A throwaway key for this job only, never used elsewhere.
      SECRETS_KEY: e2e-only:mvKxFPmkMwoqg83XaGeqtAWXKx76x32WtmH4jkjiH1g=
      ALLOWED_ORIGINS: http://localhost:3000
      WHATSAPP_PROVIDER: devlog
      DEVLOG_FILE: /tmp/cashflow-e2e/devlog.jsonl
      # The AutoGoPay stand-in (services/api/cmd/fakeautogopay, development only), for the API
      # and the worker: QRIS codes are made and checked there, never at the real AutoGoPay.
      AUTOGOPAY_BASE_URL: http://127.0.0.1:8091
      # A fake Telegram bot (decision 42, a demo channel), for the API, the worker and
      # e2e/payment-page-telegram.spec.ts: deep links are made without calling Telegram, the spec
      # posts the tenant's "Start" to /webhooks/telegram with this secret, and the bot's replies go
      # to a closed local port and are dropped. Throwaway values for this job only.
      TELEGRAM_BOT_TOKEN: "123456789:e2eOnlyFakeTelegramBotTokenNotReal_00"
      TELEGRAM_BOT_USERNAME: CashflowE2eBot
      TELEGRAM_WEBHOOK_SECRET: e2e-only-telegram-webhook-secret
      TELEGRAM_API_BASE_URL: http://127.0.0.1:9
      # Both projects' QRIS tests run in parallel in one API, so more requests wait on the
      # stand-in at once than the default of 3 allows (a request past it answers
      # qris_unavailable). The pool grows with it, so the slots stay below the pool.
      QRIS_MAX_CONCURRENT: "8"
      DATABASE_MAX_CONNS: "20"
      # 127.0.0.1, not localhost: Node may resolve localhost to ::1 first.
      API_DEV_ORIGIN: http://127.0.0.1:8080
      API_INTERNAL_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # Compose rather than service containers: db/init (the app role) must be mounted, and
      # service containers start before the checkout.
      - name: Start PostgreSQL and Redis
        run: |
          docker compose -f infra/compose.dev.yaml up -d --wait postgres redis
          # The healthcheck uses the socket, which also answers during the init restart; wait
          # for TCP as well.
          for i in $(seq 1 30); do
            docker compose -f infra/compose.dev.yaml exec -T postgres \
              pg_isready -h 127.0.0.1 -U cashflow_owner -d cashflow && exit 0
            sleep 1
          done
          exit 1
      - name: Build the API
        working-directory: services/api
        run: go build -trimpath -o bin/ ./cmd/...
      - name: Migrate and seed
        working-directory: services/api
        run: |
          ./bin/migrate
          ./bin/admin seed-demo
          ./bin/admin generate-invoices
      # seed-demo gives Griya Sejahtera a fake AutoGoPay key, so its payment pages offer QRIS,
      # and e2e/payment-page-qris.spec.ts pays, expires and fails QRs through the stand-in's
      # /_control routes. It keeps its QRs in memory, so it starts before the API and the worker.
      - name: Start the AutoGoPay stand-in
        run: |
          mkdir -p "$E2E_DIR"
          nohup make fake-autogopay > "$E2E_DIR/fake-autogopay.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$AUTOGOPAY_BASE_URL/_control/transactions" > /dev/null && exit 0
            sleep 1
          done
          echo "The AutoGoPay stand-in did not start; see the api-log artifact."
          exit 1
      - name: Start the API
        working-directory: services/api
        run: |
          mkdir -p "$E2E_DIR"
          nohup ./bin/api > "$E2E_DIR/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "$API_DEV_ORIGIN/readyz" > /dev/null && exit 0
            sleep 1
          done
          echo "The API did not become ready; see the api-log artifact."
          exit 1
      # Invoices are made by the worker: a lease entered late is queued when it is saved and
      # invoiced within seconds (e2e/tenant-account.spec.ts waits for that). Same environment
      # as the API; it has no HTTP port, so its start line in the log is the ready signal.
      - name: Start the worker
        working-directory: services/api
        run: |
          nohup ./bin/worker > "$E2E_DIR/worker.log" 2>&1 &
          for i in $(seq 1 30); do
            grep -q '"msg":"worker started"' "$E2E_DIR/worker.log" && exit 0
            sleep 1
          done
          echo "The worker did not start; see the api-log artifact."
          exit 1
      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      # The browser only, without --with-deps: the runner image already has every library
      # Chromium needs, and --with-deps then only adds CJK, Thai and X11 font packages the
      # Indonesian UI never uses, fetched from the Ubuntu mirror. That fetch once took 12 minutes
      # and ran the job out of time; the browser itself downloads in seconds. Should a runner
      # image drop a library, Chromium fails to launch with Playwright's "Host system is missing
      # dependencies" message, naming the install-deps command. The browser is not cached:
      # Playwright advises against it (a restore takes about as long as the download), and the
      # slow part was apt, which no cache covers.
      - name: Install Chromium
        working-directory: apps/web
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: End-to-end tests
        working-directory: apps/web
        run: pnpm e2e
      # Next.js checks in development only that every page load and navigation can show
      # something at once (data read outside <Suspense> is reported as an error), so the staff
      # screens are opened once more against `next dev` (e2e/dev-smoke.spec.ts).
      - name: Instant navigation check (next dev)
        working-directory: apps/web
        run: pnpm e2e
        env:
          E2E_SERVER: dev
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      # Holds the devlog lines, login codes included: throwaway codes for this job's database.
      # The worker's and the AutoGoPay stand-in's logs go in the same artifact.
      - name: Upload the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: |
            /tmp/cashflow-e2e/api.log
            /tmp/cashflow-e2e/worker.log
            /tmp/cashflow-e2e/fake-autogopay.log
          retention-days: 7
