name: repo

# Checks that apply to every pull request, whatever it touches.
on:
  pull_request:

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No file over 1 MB, no binary outside the allowlist
        run: infra/ci/check-added-files.sh "origin/${{ github.base_ref }}"
