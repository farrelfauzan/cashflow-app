# PostgreSQL and Redis for local development. Run the Go binaries on your machine with
# `make api-run` and `make worker-run`. Ports are bound to localhost only.
#
# Uploads (S6-1) need two more services, in the "uploads" profile so `make dev-up` stays quick:
# RustFS, the S3-compatible stand-in for R2, and ClamAV, which scans every upload. Start them with
# `make dev-up-uploads`; services/api/README.md says which settings turn uploads on.
name: cashflow-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cashflow_owner
      POSTGRES_PASSWORD: owner-dev-password
      POSTGRES_DB: cashflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the cashflow_app role the first time the data volume is initialised.
      - ../services/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow_owner -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly keeps queued jobs across a restart. noeviction stops Redis from silently
    # dropping job keys when it runs out of memory.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage on 127.0.0.1:9100 (the S3 API, which the API, the worker and the browser
  # all reach) and 127.0.0.1:9101 (RustFS's console). RustFS stands in for R2 (decision 46; MinIO's
  # images need a login now). Development credentials only. RustFS answers the browser's CORS
  # preflight for the web app's origin; R2 gets the same rule on its bucket.
  rustfs:
    image: rustfs/rustfs:1.0.5
    profiles: [uploads]
    environment:
      RUSTFS_ACCESS_KEY: cashflow
      RUSTFS_SECRET_KEY: cashflow-dev-secret
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - rustfsdata:/data

  # Creates the development bucket once RustFS answers; `make dev-up-uploads` runs it. Safe to
  # rerun: an existing bucket is left as it is.
  rustfs-init:
    image: amazon/aws-cli:2.40.3
    profiles: [uploads]
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: cashflow
      AWS_SECRET_ACCESS_KEY: cashflow-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - for i in $$(seq 1 60); do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket cashflow-dev 2>/dev/null && exit 0;
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket cashflow-dev >/dev/null 2>&1 && exit 0;
          sleep 2;
        done; echo "RustFS did not answer" >&2; exit 1

  # clamd on 127.0.0.1:3310. It loads its signature database on start, which takes a minute or
  # two and about 1 GB of memory, and freshclam updates the database while it runs. Until clamd
  # answers, scans fail and the worker retries them.
  clamav:
    image: clamav/clamav:1.4.3
    profiles: [uploads]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  clamavdata:
