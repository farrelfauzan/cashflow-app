# The API contract and the shared source of types. Go request and response types are generated
# from it into services/api/internal/httpapi/apigen (make api-gen); the TypeScript client will
# be generated from the same file when the web app starts.
#
# Errors always have the Error shape. Messages are in Bahasa Indonesia and safe to show; the
# web app should branch on the code, not the message.
openapi: 3.0.3
info:
  title: Cashflow API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: auth
  - name: members
  - name: properties
  - name: tenants
  - name: money
  - name: payment-page
  - name: uploads

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestLoginCode
      summary: Send a login code over WhatsApp (or, in demo environments, the linked Telegram)
      description: >
        Always answers 202 with the same body for a well-formed number, whether or not a code was
        sent and whichever channel carried it, so the response does not reveal which numbers are
        registered or which staff members linked Telegram. In demo environments (decision 42:
        development and staging, when telegramAvailable is true) the code goes to the staff
        member's linked Telegram chat (linkMyTelegram) unless whatsappOnly is true; otherwise, and
        everywhere else, it goes over WhatsApp. Limited to 3 requests per number per 15 minutes,
        with or without whatsappOnly (they share one limit): the fourth answers 429 rate_limited
        in the usual error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginCodeRequest" }
      responses:
        "202":
          description: Accepted. The body depends on the environment only, never on the number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginCodeAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyLoginCode
      summary: Check the code and start a session
      description: Sets the cf_session cookie (HttpOnly, SameSite=Lax) on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginCodeVerify" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in staff user and their organizations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /me/telegram:
    get:
      tags: [auth]
      operationId: getMyTelegram
      summary: Whether the signed-in staff member's Telegram is linked (demo environments only)
      description: >
        Telegram is a demo channel (decision 42): development and staging, with test accounts. The
        "Hubungkan Telegram" card on the staff member's account. Always 200: when the environment
        has no Telegram bot (production), or does not send to linked chats (TELEGRAM_MESSAGES off),
        it answers {available: false, linked: false}, never 404, so the card hides itself. linked turns false after unlinkMyTelegram, after /stop in the
        linked chat, and after Telegram reports the chat unreachable. No RBAC action: this is the
        user's own account, not organization data; the session is the access.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTelegram" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      operationId: linkMyTelegram
      summary: A one-time deep link to the Telegram bot, to get login codes there ("Hubungkan Telegram")
      description: >
        Answers the bot's deep link, https://t.me/<bot>?start=<code>. The code is fresh randomness;
        it works once and for 10 minutes, and asking again makes another without cancelling the
        first. Opening the link and pressing Start in Telegram links that chat to the signed-in
        staff member (getMyTelegram then shows linked); a new link replaces the older one and the
        older chat is told, and /stop in the chat unlinks it. Login codes then go to that chat when
        requestLoginCode's telegramAvailable is true. 404 telegram_unavailable when the
        environment has no bot or does not send to linked chats (getMyTelegram's available is false
        then). Limited to 5 per staff member per 15 minutes (429 rate_limited).
        The response carries Cache-Control: no-store. The deep link holds the code: open it, never
        log it or send it anywhere else. No RBAC action: the user's own account.
      responses:
        "201":
          description: The deep link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramDeepLink" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No bot in this environment, or it does not send to linked chats (code telegram_unavailable)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      operationId: unlinkMyTelegram
      summary: Stop sending the signed-in staff member's login codes to Telegram
      description: >
        Ends the staff member's live Telegram link, so login codes go over WhatsApp again. 204
        also when nothing was linked or the environment has no bot. No RBAC action: the user's own
        account.
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/me:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [members]
      operationId: getOrgMe
      summary: The signed-in member's roles and what they may do in this organization
      description: >
        Capabilities are for showing or hiding controls. The server checks every request
        regardless. "conditional" means allowed on some records, such as a karyawan's own
        assigned tenants. The first call by a member records their firstSignInAt in this
        organization; later calls leave it unchanged. The web app makes this call when the
        member opens the organization.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMeResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/collector-candidates:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [members]
      operationId: listCollectorCandidates
      summary: The active members a lease's collector can be picked from (needs lease:manage, for the whole organization or limited to properties)
      description: >
        For the collector picker on the lease form. A narrow exception to the rule that a role
        limited to some properties reads nothing organization-wide (decision 27, like decision
        22 for charge types): any member who may manage some lease may list the candidates.
        Only active members, karyawan first, then by name, with their name and whether they
        hold the karyawan role; no phone numbers and no other roles. Listing writes no allowed
        audit row; a refusal is audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectorCandidateList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [members]
      operationId: listMembers
      summary: One page of the organization's members (needs member:read)
      description: >
        Paginated (see the Page parameters). q matches the name, or the WhatsApp number when it
        is made of digits and phone punctuation (at least 3 digits; 0812, 62812 and +62 812 all
        match 0812-...).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: collectorDisabled
          in: query
          description: true keeps only disabled members who are still collector of an active lease.
          schema: { type: boolean }
        - name: sort
          in: query
          description: By name (the default) or when the member was added; a leading - reverses it.
          schema: { type: string, enum: [name, -name, createdAt, -createdAt], default: name }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [members]
      operationId: inviteMember
      summary: Add a staff member by WhatsApp number (needs member:invite and role:assign per role)
      description: >
        Each role can be limited to one property with propertyId, as in setMemberRoles. The
        member and every role are created together, so the member never holds a broader role
        than the one asked for. A role limited to a property grants nothing on
        organization-wide records, so a member whose roles are all limited to properties cannot
        invite anyone.

        After the member is created, the invitation is sent once over WhatsApp: who invited
        them, the organization, the role and a link to the login page (no token in it; the
        member signs in with the usual WhatsApp code). A failed or rate-limited send never
        undoes the invite: the answer is still 201, with invitation.state not_sent, and
        resendMemberInvitation sends it again. A number that is already a member answers 409
        already_member and sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMember" }
      responses:
        "201":
          description: Created. invitation.state says whether the WhatsApp message went out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The number is already a member of this organization (code already_member)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/members/{memberId}/invitation:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [members]
      operationId: resendMemberInvitation
      summary: Send a member's WhatsApp invitation again (needs member:invite)
      description: >
        Sends the same invitation as inviteMember and returns the member with the new
        invitation state. Members who were never invited (the organization's founders) have
        nothing to resend. WhatsApp sends from one number shared by every organization, so
        invitation sends, first sends included, are limited to 20 per organization per hour
        and 3 per WhatsApp number per 24 hours.
      responses:
        "200":
          description: Sent. invitation.state is sent and lastSentAt is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The member is disabled (code member_disabled) or was never invited (code not_invited)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            The number cannot receive WhatsApp messages (code whatsapp_undeliverable, field
            phone). Trying again does not help; the number needs to be checked.
            invitation.state is now not_sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "Too many invitation sends for this organization or number (code rate_limited)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "WhatsApp could not send the message (code whatsapp_unavailable); invitation.state is now not_sent"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/members/{memberId}/roles:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [members]
      operationId: setMemberRoles
      summary: Replace a member's built-in roles (needs member:manage and role:assign per changed role)
      description: >
        Nobody can change their own roles. Each role can be limited to one property with
        propertyId; give the same role once per property to cover several. A role limited to a
        property grants nothing on organization-wide records (members, settings, payslips), so
        a member who needs those also needs the role without a property. The Admin role for
        the whole organization cannot be taken from the last active member who holds it; Admin
        limited to a property does not count (409 last_admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRoles" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The change takes Admin from the last active Admin for the whole organization (code last_admin)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/members/{memberId}/status:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [members]
      operationId: setMemberStatus
      summary: Disable or re-enable a member (needs member:manage and role:assign on every role the member holds)
      description: >
        A disabled member keeps their roles but can do nothing in this organization: their
        sessions are refused here at once (the organization answers 404 not_found, as for a
        non-member) and the organization leaves their list. Their other organizations and their
        history are untouched. Re-enabling restores the same roles. Nobody can change their own
        status, and an Admin cannot disable or re-enable a Supervisor. Setting the status the
        member already has changes nothing and returns the member. The last active Admin for the
        whole organization cannot be disabled (409 last_admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          description: "The status is not active or disabled (code invalid_input, field status)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The member is the last active Admin for the whole organization (code last_admin)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/properties:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [properties]
      operationId: listProperties
      summary: One page of the properties the member may see (needs property:read)
      description: >
        A member whose roles are limited to some properties gets only those, and total counts
        only those. Paginated (see the Page parameters); q matches the name. Sorted by name,
        with numbers in natural order.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name], default: name }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [properties]
      operationId: createProperty
      summary: Add a property (needs property:manage for the whole organization)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "Another property already has this name (code name_taken, field name)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/properties/{propertyId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [properties]
      operationId: getProperty
      summary: One property with its unit counts (needs property:read on it)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [properties]
      operationId: updateProperty
      summary: Change a property's name, kind or address (needs property:manage on it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "Another property already has this name (code name_taken, field name)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/properties/{propertyId}/units:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [properties]
      operationId: listUnits
      summary: One page of a property's units (needs unit:read on that property)
      description: >
        Paginated (see the Page parameters); q matches the label. Sorted by label, with numbers
        in natural order ("Kamar 2" before "Kamar 11").
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: sort
          in: query
          schema: { type: string, enum: [label, -label], default: label }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [properties]
      operationId: createUnit
      summary: Add a unit to a property (needs unit:manage on that property)
      description: >
        The unit offers the terms given, or its property kind's default (see UnitInput.terms).
        Prices given are recorded effective today; changes are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The property already has a unit with this label (code label_taken, field label)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: unitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [properties]
      operationId: updateUnit
      summary: Change a unit's label, offered terms or today's prices (needs unit:manage on its property)
      description: >
        See UnitInput.terms. A price that differs from the one in force today adds a row to the
        unit's price history, effective today; nothing is ever overwritten. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The property already has a unit with this label (code label_taken, field label), or a
            price changes while the unit was invoiced today (code price_too_early, field terms):
            a new price then takes effect tomorrow at the earliest, through createUnitPrice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/units/{unitId}/prices:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: unitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [properties]
      operationId: listUnitPrices
      summary: A unit's price history (needs unit:read on its property)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitPriceHistory" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [properties]
      operationId: createUnitPrice
      summary: Record a unit's new price for a term from a date (needs unit:manage on its property)
      description: >
        Adds a row to the append-only price history; the price in force on a day is the latest
        row effective on or before it. Audited. Use it for a price that starts later; updateUnit
        records a price effective today.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitPriceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitPrice" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The unit does not offer this term (code term_not_offered, field months), or the
            effective date is before today, in Asia/Jakarta, or on or before the day the unit's
            newest invoice was made (code price_too_early, field effectiveFrom).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/tenants:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [tenants]
      operationId: listTenants
      summary: Tenants the member may see, with their leases (needs tenant:read)
      description: >
        A tenant is visible through any of their leases: a karyawan sees the tenants whose lease
        names them as collector, a member limited to a property sees the tenants with a lease
        there, and only those leases. Tenants without a lease are visible only to members with
        tenant:read for the whole organization. Filters, q and total see only what the member
        may see: the visible tenants and, for each, their visible leases.

        Paginated (see the Page parameters). q matches the name, the unit label of a lease, or
        the WhatsApp number when q is made of digits and phone punctuation (at least 3 digits;
        0812, 62812 and +62 812 all match 0812-...).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: propertyId
          in: query
          description: Keeps tenants with a lease in this property.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: >
            The status of the tenant's first lease: active (started and running), upcoming
            (booked ahead: it starts after today, Asia/Jakarta), ended (every lease ended), none
            (no lease).
          schema: { type: string, enum: [active, upcoming, ended, none] }
        - name: collectorDisabled
          in: query
          description: >
            true keeps only tenants with an active lease whose collector is disabled (the
            "belum punya penagih" flag).
          schema: { type: boolean }
        - name: sort
          in: query
          description: By name (the default) or when the tenant was added; a leading - reverses it.
          schema: { type: string, enum: [name, -name, createdAt, -createdAt], default: name }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Add a tenant (needs tenant:manage for the whole organization)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "Another tenant already has this number (code phone_taken, field phone)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tenants]
      operationId: getTenant
      summary: One tenant with the leases the member may see (needs tenant:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [tenants]
      operationId: updateTenant
      summary: Change a tenant's name, number or note (needs tenant:manage)
      description: >
        A member limited to some properties may change a tenant only when every active lease of
        that tenant is in their properties.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "Another tenant already has this number (code phone_taken, field phone)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [tenants]
      operationId: createLease
      summary: Rent a unit to a tenant (needs lease:manage on the unit's property)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The unit already has an active lease (code unit_occupied, field unitId), does not
            offer the term (code term_not_offered, field termMonths), or has no price for the term
            in force today (code no_price, field termMonths).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases/{leaseId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
    put:
      tags: [tenants]
      operationId: updateLease
      summary: Change the terms of an active lease (needs lease:manage; audited)
      description: >
        Unit and tenant never change; end the lease and start a new one instead. A rent change
        applies from the next invoice. A start date after the lease's planned end date is refused
        (field startDate); change the planned end date first. Sending the lease's current
        collector keeps them even when they have been disabled; any other collector must be an
        active member. Once the lease has an invoice, its start date and billedFrom can no longer
        change (409 lease_has_invoices); the other terms stay editable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseTerms" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The lease has already ended (code lease_ended), or it already has an invoice and the
            request changes its start date or billedFrom (code lease_has_invoices, field startDate
            or billedFrom; a wrong start date is then fixed by ending the lease and starting a new
            one).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases/{leaseId}/planned-end:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
    put:
      tags: [tenants]
      operationId: setLeasePlannedEnd
      summary: Set, change or clear an active lease's planned end date (needs lease:manage; audited)
      description: >
        The planned end date ("Rencana keluar") is the tenant's last day, set when they say they
        will not continue. It must be on or after today in Asia/Jakarta and not before the start
        date; null clears it, and leaving the key out is refused (400, field plannedEndDate). It
        can change until the move-out, which clears it. No invoice is generated for a period that
        starts after it. In the same transaction, setting it (or moving it earlier) cancels each
        invoice already generated for such a period with a correction of minus its billed
        amount, reason "sewa tidak diperpanjang"; moving it later or clearing it restores each
        invoice it had cancelled that is back in range, reason "rencana keluar diubah". Money
        paid on a cancelled invoice is reallocated (FIFO) and the rest is credit. Each correction
        also needs correction:create on its invoice and is audited; a denial answers 403 and
        changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeasePlannedEnd" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The lease has already ended (code lease_ended)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases/{leaseId}/move-out:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags: [tenants]
      operationId: moveOut
      summary: End a lease on a date (needs lease:manage; audited)
      description: >
        The end date is the last day of the lease: not before the start date and not after
        today in Asia/Jakarta. A lease that has not started yet (a booking) is cancelled the same
        way, with the end date equal to its start date; it will never be invoiced. The unit is
        free for a new lease right away, and any planned end date is cleared. In the same
        transaction: a period the tenant started that has no invoice yet gets one; every invoice
        for a period that starts after the end date is cancelled (reason "sewa tidak
        diperpanjang"), every invoice of a cancelled booking too (reason "sewa dibatalkan"); then
        what the lease's invoices still owe is paid from its deposit, oldest period first (reason
        "potong deposit"). Each correction also needs correction:create and is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveOut" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The lease has already ended (code lease_ended)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases/{leaseId}/charges:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
    put:
      tags: [tenants]
      operationId: setLeaseCharges
      summary: Replace the fixed extra charges of an active lease, and its expected metered types (needs lease:manage; audited)
      description: >
        Replaces the whole set at once: charge types left out are removed, and an empty list
        removes every extra. Each charge type appears at most once, must belong to the
        organization and must not be metered (metered amounts are recorded per month instead).
        Like a rent change, the new amounts apply from the next invoice.
        meteredChargeTypeIds, when sent, replaces the metered types the lease expects an amount
        for every month (each metered, at most once); left out, they stay as they are. They only
        decide which leases listMissingMeterReadings flags: amounts already recorded are billed
        whatever the set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseChargesInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400":
          description: "Bad input (code invalid_input, field such as charges[1].chargeTypeId, charges[0].amount or meteredChargeTypeIds[0])"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The lease has already ended (code lease_ended)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/leases/{leaseId}/metered-charges:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
    get:
      tags: [money]
      operationId: listLeaseMeteredCharges
      summary: A lease's metered amounts, newest month first (needs charge:read on the lease)
      description: >
        One page of the lease's metered amounts (listrik, air), the newest usage month first,
        then by charge type name. Each says whether an invoice line bills it, and which invoice.
        nextInvoice is the invoice an amount recorded now would go on and the Asia/Jakarta day it
        is made ("Tagihan November 2026, terbit 21 Nov"); it is missing when no further invoice
        will be made (the lease has ended, or its planned end date is reached). Ended leases are
        readable. A member limited to some properties, or to their own tenants, may read only
        those leases.
      parameters:
        - name: chargeTypeId
          in: query
          description: Only this charge type. A malformed id is a 400 with field chargeTypeId.
          schema: { type: string, format: uuid }
        - name: usageMonth
          in: query
          description: Only this usage month, YYYY-MM. A bad value is a 400 with field usageMonth.
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeteredChargeList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/leases/{leaseId}/metered-charges/{chargeTypeId}/{usageMonth}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeaseId"
      - name: chargeTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: usageMonth
        in: path
        required: true
        description: The month the usage belongs to, YYYY-MM.
        schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10" }
    put:
      tags: [money]
      operationId: recordMeteredCharge
      summary: Record or change one month's metered amount of an active lease (needs charge:record on the lease; audited)
      description: >
        "Catat meteran". Saves the rupiah amount of a metered charge type (listrik, air) for one
        usage month; the meter numbers are optional and only shown. The amount is billed once, on
        the next invoice generated after it is saved ("Listrik Oktober 2026" on the November
        invoice); a missing amount never delays an invoice. Saving the same month and type again
        replaces the amount while no invoice bills it; once one does it is locked (409
        metered_charge_billed) and a fix is a correction on that invoice. The usage month may not
        be before the month the lease started or after this month (Asia/Jakarta). Admins may
        record for every lease, karyawan only for the tenants they collect from.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeteredChargeInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeteredCharge" }
        "400":
          description: "Bad input (code invalid_input, field usageMonth, chargeTypeId, amount, meterStart or meterEnd)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The month's amount is already on an invoice (code metered_charge_billed), or the
            lease has ended (code lease_ended).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/metered-charges/missing:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [money]
      operationId: listMissingMeterReadings
      summary: Active leases with a metered amount not recorded for a month, "meteran belum dicatat" (needs charge:read)
      description: >
        One page of the active leases, started by the month's last day, that expect a metered
        type (meteredChargeTypes on the lease) with no amount for that usage month, by tenant
        name, then unit. Each lists the missing types and the invoice an amount recorded now would
        go on. A member limited to some properties, or to their own tenants, sees only those
        leases.
      parameters:
        - name: month
          in: query
          description: >
            The usage month, YYYY-MM; last month in Asia/Jakarta when empty. A bad value or a
            month after this one is a 400 with field month.
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10" }
        - name: propertyId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingMeterReadingList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/charge-types:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [tenants]
      operationId: listChargeTypes
      summary: The organization's kinds of extra charge, by name (needs lease:manage, for the whole organization or limited to properties)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeTypeList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [tenants]
      operationId: createChargeType
      summary: Add a kind of extra charge (needs lease:manage for the whole organization; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeTypeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeType" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "Another charge type already has this name (code charge_type_taken, field name)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/imports/tenants:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [tenants]
      operationId: importTenants
      summary: Import properties, units, tenants and leases from a CSV file (needs tenant:manage and lease:manage for the whole organization)
      description: >
        Needs tenant:manage and lease:manage for the whole organization, plus property:manage or
        unit:manage for each property or unit a row creates; a denial stops the whole import.

        The first line names the columns, separated by commas or semicolons, in any order:
        property, unit, tenant_name, phone, rent, start_date, and optionally deposit,
        property_kind (kos, kontrakan, ruko, other; new properties default to other) and
        bill_from ("Mulai tagih dari", an anniversary of the start date, as on createLease;
        empty bills from the start date). Indonesian names work too (properti, kamar,
        nama_penyewa, no_wa, sewa, tanggal_mulai, jaminan, jenis_properti, mulai_tagih). Other
        columns are ignored. Rent is due on the day of the start date; the
        due_day (jatuh_tempo) column of older templates is not used, and a row whose due day
        differs from its start date's day gets a note saying so.
        Amounts are whole rupiah ("850000", "850.000" or "Rp850.000").
        Dates are 2026-10-01 or 01/10/2026 (day first).

        Properties match by name, units by label inside their property, tenants by phone; anything
        missing is created. A row whose unit already has an active lease for the same tenant is
        reported as matched and left unchanged (differing terms come back as a note), so running the
        same file twice is safe; an active lease for another tenant is an error. A phone already
        stored under a different name is an error too: one phone is one tenant. Amounts take dots
        only as thousands separators; anything after a decimal point other than zeros is refused.

        With dryRun (the default) nothing is saved and every row comes back with its errors. With
        dryRun=false everything is saved in one transaction, but only when no row has an error;
        otherwise nothing is saved and committed is false. At most 2000 rows and 1 MiB.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Every row with what happened or would happen to it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: "The file cannot be read: missing columns, no rows or too many (code invalid_input, field file)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/imports/tenants/template:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [tenants]
      operationId: getTenantImportTemplate
      summary: Download a CSV template for the tenant import (needs tenant:manage and lease:manage for the whole organization)
      description: >
        A file to fill in and upload to importTenants. UTF-8 with a byte order mark so Excel opens
        it correctly, separated by semicolons as Excel writes CSV in an Indonesian locale. The
        header row uses the Indonesian column names (properti, jenis_properti, kamar,
        nama_penyewa, no_wa, sewa, tanggal_mulai, mulai_tagih, jaminan), followed by two example
        rows. The example rows only show the format: the import refuses them by their phone
        numbers ("Ini baris contoh. Hapus baris ini sebelum mengimpor."), so an example left in
        the file never becomes a tenant. Served as an attachment named template-impor-penyewa.csv.
      responses:
        "200":
          description: The template
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="template-impor-penyewa.csv"' }
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/tenants/{tenantId}/account:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [money]
      operationId: getTenantAccount
      summary: A tenant's money, invoices, payments and corrections (needs invoice:read and payment:read)
      description: >
        Everything the tenant was billed and paid, across all their leases, with the totals the
        Detail penyewa page shows: what they still owe, the due date of the oldest unpaid
        invoice and their credit. Every figure comes from the server; the page computes none.
        A member limited to some properties needs both reads through every lease the tenant has
        or had, since the totals span all of them; otherwise 403. Invoices and payments are
        bounded per tenant (about one invoice per term), so they are plain arrays, oldest first.
        It also carries the tenant's payment promise as staff see it: the active one's newest
        version, how many promises the tenant broke, and what a promise made now may say (the
        same promiseDates and nextInvoiceDueDate as the payment page).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAccount" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/tenants/{tenantId}/open-invoices:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [money]
      operationId: listTenantOpenInvoices
      summary: A tenant's invoices still owed, of any month (needs invoice:read)
      description: >
        The tenant's invoices with something still owed (balance above 0), of any month, oldest
        period first, in the same order as the account. Paid and cancelled invoices are left out.
        It needs invoice:read only, so a member who may share a payment link but not read
        payments (the built-in Karyawan) can find the invoice to share. It is filtered like
        listInvoices: a member whose invoice:read is conditional sees only the invoices of leases
        they may read (a karyawan the leases they collect, a member limited to some properties
        the leases in their properties). A tenant the caller can see none of answers []. 404
        not_found only when the tenant does not exist in the organization; 403 forbidden when
        invoice:read is denied outright, as listInvoices answers. Bounded per tenant (about one
        invoice per term), so it is a plain array.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantOpenInvoice" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/tenants/{tenantId}/promises:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [money]
      operationId: listTenantPromises
      summary: A tenant's payment promises, newest first, with every version (needs promise:read)
      description: >
        The tenant's promises ("Janji pelunasan"), newest first with the id breaking ties, each
        with all its versions oldest first: an edit adds a version, nothing is overwritten. Each
        version names the invoices it covers (those still owing when it was made). At most one
        promise is active. Needs promise:read on the tenant, checked as getTenantAccount checks
        its reads: a member limited to some properties needs it through every lease the tenant
        has or had; otherwise 403. 404 not_found when the tenant does not exist in the
        organization.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantPromiseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [money]
      operationId: makeTenantPromise
      summary: Record a tenant's payment promise, or edit the active one (needs promise:create; audited)
      description: >
        The same rules as makePaymentPromise on the payment page, recorded by a member (source
        admin) with an optional note. When the tenant has an active promise this adds its next
        version (an edit); otherwise it makes a new promise. Needs promise:create on the tenant,
        checked like listTenantPromises (403 otherwise); allowed and denied checks are audited.
        The answer is the promise with all its versions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakeTenantPromiseRequest" }
      responses:
        "200":
          description: The promise, with the new version last
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantPromise" }
        "400":
          description: >
            invalid_input (field kind, promisedDate, promisedAmount, payingNow or note);
            promise_date_out_of_range (field promisedDate); promise_no_next_invoice (field kind);
            promise_amount_above_outstanding (field payingNow or promisedAmount). A body that is
            not the documented JSON, or names an unknown field, is invalid_json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "The tenant owes nothing, or nothing is left after payingNow (code promise_nothing_owed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [money]
      operationId: getDashboard
      summary: The Supervisor's home, Beranda (needs report:read)
      description: >
        The month's money and who is in arrears now. The month's figures cover the invoices of
        that month: an invoice belongs to the month of its period (Tagihan November), which for a
        regular invoice is the month of its due date. Arrears are not tied to the month: every
        invoice still owed after its due date (debt from the day after it, Asia/Jakarta). A member
        limited to some properties sees, and every figure counts, only the invoices of leases in
        their properties.
      parameters:
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/invoices:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [money]
      operationId: listInvoices
      summary: Penagihan, the invoices of a month (needs invoice:read)
      description: >
        One page of the month's invoices (an invoice belongs to the month of its period), with
        each invoice's lines. summary covers the whole month in the chosen property, whatever
        status, q and page are, so the tiles stay the same while the table is filtered; total
        counts the rows matching every filter. A member limited to some properties sees, and
        every figure counts, only the invoices of leases in their properties. Each row carries
        its tenant's active promise when that promise's newest version covers the row's invoice,
        and the tenant's count of broken promises.
      parameters:
        - $ref: "#/components/parameters/Period"
        - name: status
          in: query
          description: >
            open: nothing paid; partial: some paid; paid; cancelled (corrected to zero);
            unpaid: open or partial, due or not ("Belum lunas"); overdue: still owed after its
            due date, of any month (period is ignored, since debt is not tied to one month; the
            dashboard's arrears link here). Empty means every invoice.
          schema:
            type: string
            enum: [open, partial, paid, cancelled, unpaid, overdue]
        - name: propertyId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Search"
        - name: sort
          in: query
          description: dueDate (the default, oldest first), -dueDate, tenantName, or -outstanding (most owed first).
          schema:
            type: string
            enum: [dueDate, -dueDate, tenantName, -outstanding]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/payments:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [money]
      operationId: recordPayment
      summary: Record a cash or transfer payment from a tenant (needs payment:record; audited)
      description: >
        The payment pays the tenant's open invoices oldest period first, across all their
        leases (FIFO), whatever its received date; what is left is credit, which pays the next
        invoice the moment it is made. The answer says what it paid, the tenant's remaining
        total and credit (the W12 result panel).
        requestId makes a retry or a double submit harmless: the same requestId with the same
        body answers 200 with the payment already recorded, nothing is recorded twice; the same
        requestId with any other body is 409 request_id_reused.
        A member limited to some properties may record a payment only for a tenant whose every
        lease, current or ended, is in their properties, since FIFO may pay any of them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "200":
          description: Already recorded under this requestId; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No such tenant in the organization (code not_found, field tenantId)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "The requestId was used for a different payment (code request_id_reused)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/corrections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [money]
      operationId: createCorrection
      summary: Correct what an invoice bills or what a payment received, with a reason (needs correction:create; audited)
      description: >
        "Koreksi nominal". Nothing is edited: the correction is a new row with a signed amount,
        and the invoice's billed amount or the payment's net amount is its original amount plus
        all its corrections. A correction may bring either to zero (an invoice at zero is
        cancelled), never below (409 correction_below_zero). Allocation reruns at once: money
        paid on an invoice corrected down goes back through FIFO and the rest is credit; a
        payment corrected below what it already paid takes that back from its newest invoices.
        Corrections are listed on the Supervisor's dashboard and report.
        requestId works as for recordPayment (200 for a repeat, 409 request_id_reused).
        A member limited to some properties may correct an invoice of a lease in their
        properties, and a payment of a tenant whose every lease is in their properties.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionResult" }
        "200":
          description: Already created under this requestId; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No such invoice or payment in the organization (code not_found, field invoiceId or paymentId)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            The correction would take the invoice's billed amount or the payment's net amount
            below zero (code correction_below_zero, field amountDelta), newAmount equals the
            current amount (code correction_no_change, field newAmount), or the requestId was used
            for a different correction (code request_id_reused).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/invoices/{invoiceId}/payment-links:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InvoiceId"
    post:
      tags: [payment-page]
      operationId: createPaymentLink
      summary: Make a new payment link for an invoice, "Salin link bayar" (needs invoice:share; audited)
      description: >
        Each call makes a new link, /t/<token> on the web app; the token is shown only in this
        answer, since only its hash is stored, so copy it now. An invoice has as many links as
        were made, and each works until 30 days after the invoice is paid or cancelled. The link
        names one invoice, and its page shows everything the tenant owes. A karyawan may share
        only invoices of tenants they collect from; a member limited to some properties, only
        invoices of leases in their properties.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The invoice was paid or cancelled 30 days ago or longer, so a link would not work
            (code payment_link_expired_invoice).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/invoices/{invoiceId}/payment-links/revoke:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InvoiceId"
    post:
      tags: [payment-page]
      operationId: revokePaymentLinks
      summary: Stop every payment link of an invoice (needs invoice:share; audited)
      description: >
        Every link made for the invoice stops working at once and its page answers 404, as for a
        link that never existed. revoked counts the links that were still working; 0 is not an
        error. New links can be made afterwards.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinksRevoked" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /orgs/{orgId}/uploads:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start a photo upload straight to storage (needs the action of the record it is for; audited)
      description: >
        Answers a presigned PUT URL that is valid for a few minutes (putExpiresAt). The browser
        sends the file body to putUrl with method PUT and exactly the headers in putHeaders; the
        body must be exactly size bytes, since the size is signed into the URL (storage has no
        presigned POST, so this is the size limit). Then it calls completeUpload, and polls
        getUpload until status is no longer pending.

        The upload starts pending. A queue job checks the stored file's real size and type (from
        its content, never its name or declared type), and scans it for malware: only a clean
        file can be read, through getUpload's short-lived downloadUrl, always as a download.

        What the upload is for decides the permission: purpose cash_receipt (a receipt photo for
        tenantId) needs cash:record on the tenant, through every lease the tenant has or had, so a
        karyawan may upload only for tenants they collect from; purpose cash_deposit (a deposit
        photo, no tenantId) needs cash:deposit on the caller's own record.

        Errors: 400 upload_purpose_unknown (field purpose), upload_type_not_allowed (field
        contentType: only image/jpeg, image/png and image/webp), upload_too_large (field size:
        at most 10 MB, 10485760 bytes), invalid_input (field size or tenantId); 404 not_found
        with field tenantId for a tenant not in the organization; 503 uploads_unavailable when
        this server has no file storage configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "201":
          description: Created; PUT the file to putUrl, then call completeUpload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No such tenant in the organization (code not_found, field tenantId)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "This server has no file storage configured (code uploads_unavailable)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Say the PUT finished, so the scan starts (only the member who started the upload; audited)
      description: >
        Queues the scan. Calling it again is harmless and answers the upload as it is now. Only the
        member who started the upload may complete it, and they must still have the permission
        createUpload needed. A file that never arrived stays pending for a while and is then
        rejected.
      responses:
        "200":
          description: The upload, usually still pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No such upload in the organization (code upload_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "This server has no file storage configured (code uploads_unavailable)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs/{orgId}/uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [uploads]
      operationId: getUpload
      summary: An upload's scan status and, once it is clean, a short-lived download link
      description: >
        Allowed with payment:check or cash:read (through every lease of a receipt's tenant; for
        a deposit photo, for the whole organization), or with the action that started the upload on the
        same record (a karyawan reads the receipts of tenants they collect from and their own
        deposit photos). downloadUrl is present only when status is clean, lasts a few minutes
        (downloadExpiresAt) and always downloads the file as an attachment; ask again for a new
        one. A pending, rejected or infected upload never has one.
      responses:
        "200":
          description: The upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "No such upload in the organization (code upload_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "This server has no file storage configured (code uploads_unavailable)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /t/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    get:
      tags: [payment-page]
      operationId: getPaymentPage
      summary: The tenant payment page behind a link (public; the token is the access)
      description: >
        No session: the token alone grants the page, and only for the link's own tenant. It shows
        who bills them, the tenant's name and the link's invoice (so a forwarded link is
        obvious), everything the tenant owes with the open invoices oldest first, the bank
        account for a manual transfer, the tenant's active payment promise with the dates a
        new one may name (makePaymentPromise), and whether the tenant can link or has linked
        Telegram (linkPaymentPageTelegram). Nothing else: no phone number, payment history,
        staff name or note. A malformed, unknown or revoked token all answer the same 404. Limited per
        token and per client address (429 rate_limited). Responses carry Cache-Control: no-store
        and Referrer-Policy: no-referrer.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "404":
          description: "No working link with this token (code payment_link_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link's invoice was paid or cancelled 30 days ago or longer (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/preview:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    get:
      tags: [payment-page]
      operationId: getPaymentPreview
      summary: What paying an amount now would pay (public; "Bayar sebagian")
      description: >
        No session: the token is the access, and link errors answer as for getPaymentPage. Read
        only: nothing is recorded. It walks the tenant's open invoices oldest period first, the
        order a payment pays them, and lists each invoice the amount reaches with what it owes,
        what the amount pays on it and what it would still owe, so the page shows "Uang ini
        dipakai untuk" without doing the math. Invoices the amount does not reach are not listed.
        The amount is whole rupiah, at least Rp1 and at most what the tenant owes now; there is
        no QRIS limit here, since the page also previews a bank transfer. The answer is what
        paying would do at this moment: a payment recorded meanwhile changes it. Limited per
        token and per client address together with getPaymentPage (429 rate_limited). Responses
        carry Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      parameters:
        - name: amount
          in: query
          required: true
          description: Whole rupiah the tenant would pay. Errors use field amount.
          schema: { type: integer, format: int64, minimum: 1, example: 1000000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPreview" }
        "400":
          description: >
            Field amount: missing, not a whole number or below Rp1 (code invalid_input), or above
            what the tenant owes now, including when they owe nothing (code
            amount_above_outstanding).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "No working link with this token (code payment_link_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link's invoice was paid or cancelled 30 days ago or longer (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/status:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    get:
      tags: [payment-page]
      operationId: getPaymentStatus
      summary: The state of the tenant's latest QRIS attempt (public; polled by the payment page)
      description: >
        No session: the token is the access, as for getPaymentPage, and link errors answer the
        same. Attempts belong to the tenant, so every working link of the tenant shows the same
        latest attempt. none means no QR was made yet; pending means the QR can be paid; checking
        means the tenant said they paid and no answer has come yet ("Sedang dicek"); paid means
        the attempt was paid; expired means the QR expired or was cancelled ("QR kedaluwarsa").
        A pending QR at or past its expiry shows as expired unless a check was asked for; a late
        payment is still recorded when it arrives. The latest attempt can be old (paid or
        abandoned weeks ago), so the page chooses its first state from getPaymentPage (paid,
        outstanding) and reads this only to resume a pending or checking QR or to poll a QR made
        in this visit; it never shows a paid or expired answer from before the visit. Limited
        per token and per client address together with getPaymentPage (429 rate_limited).
        Responses carry Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrisStatus" }
        "404":
          description: "No working link with this token (code payment_link_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link's invoice was paid or cancelled 30 days ago or longer (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/qris.png:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    get:
      tags: [payment-page]
      operationId: getPaymentQRImage
      summary: The QR image of the tenant's live QRIS attempt (public; the token is the access)
      description: >
        A PNG drawn by the API, with the amount, the unit and property of the link's invoice and
        the expiry printed under the code, so the page loads no third-party image. Link errors
        answer as for getPaymentPage. 404 qris_not_found when the tenant has no QR yet; 410
        qris_expired when the latest QR expired, was paid or was cancelled, or is at or past its
        expiry. Limited per token and per client address together with getPaymentPage (429
        rate_limited). Responses carry Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      responses:
        "200":
          description: The QR image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: "No working link with this token (code payment_link_not_found), or no QR yet (code qris_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link expired (code payment_link_expired), or the QR can no longer be paid (code qris_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/qris:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    post:
      tags: [payment-page]
      operationId: createPaymentQris
      summary: Get a QRIS code for an amount (public; "Bayar QRIS")
      description: >
        No session: the token is the access, and link errors answer as for getPaymentPage. The
        amount is whole rupiah, Rp1 to Rp10.000.000 (AutoGoPay's limit; above it the tenant pays
        in parts or by bank transfer) and at most what the tenant owes now. Paying through any of
        the tenant's links pays the oldest invoice first.


        AutoGoPay can block a merchant whose account makes QRs in a loop, so the tenant's live QR
        is reused: when it is for the same amount and has more than two minutes left, it is
        answered again and nothing is generated. Otherwise the tenant's pending QR is cancelled at
        AutoGoPay and a new one is made. If that shows the previous QR was paid meanwhile, the
        payment is recorded, no new QR is made and the answer is status paid: reload
        getPaymentPage for what is left. A pending QR whose tenant asked for a check and that is
        reused answers checking. On pending, show the image from getPaymentQRImage and poll
        getPaymentStatus.


        At most 5 new QRs per tenant in 24 hours (429 qris_limit); failed attempts count, reuses
        do not. Never retry automatically, with one exception: 503 qris_overloaded (with
        Retry-After) means too many payments are waiting on AutoGoPay right now and nothing reached
        it, so the page may try once more after Retry-After. 503 qris_unavailable ("QRIS
        gangguan") when AutoGoPay fails or the organization has no AutoGoPay account: offer bank
        transfer. 409 qris_busy
        when another request for the same tenant is making or checking a QR right now (a double
        tap): poll getPaymentStatus. The request takes up to about 20 seconds; if the page gives
        up, what AutoGoPay answered is still recorded and getPaymentStatus shows it. Limited per
        token and per client address together with getPaymentPage (429 rate_limited). Responses
        carry Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQrisRequest" }
      responses:
        "200":
          description: "The QR to show (pending), a reused one being checked (checking), or the previous QR turned out paid (paid)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrisStatus" }
        "400":
          description: >
            Field amount: missing or below Rp1 (code invalid_input), above Rp10.000.000
            (code qris_amount_above_limit), or above what the tenant owes (code
            qris_amount_above_outstanding). An amount that is not a whole number, or a body that is
            not the documented JSON, is invalid_json with no field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "No working link with this token (code payment_link_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "The tenant owes nothing (code nothing_to_pay), or a QR is being made or checked right now (code qris_busy)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link expired (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "Too many requests (code rate_limited), or 5 new QRs in 24 hours (code qris_limit)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            AutoGoPay failed or QRIS is not set up for the organization (code qris_unavailable):
            offer bank transfer. Or too many payments are waiting on AutoGoPay right now (code
            qris_overloaded, with Retry-After in seconds): nothing reached AutoGoPay, so the page
            may try once more after Retry-After before it offers bank transfer.
          headers:
            Retry-After:
              description: Seconds to wait before trying once more. Sent with qris_overloaded only.
              schema: { type: integer, example: 5 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /t/{token}/check:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    post:
      tags: [payment-page]
      operationId: checkPaymentQris
      summary: The tenant says they paid their QR (public; "Saya sudah bayar")
      description: >
        No session: the token is the access, and link errors answer as for getPaymentPage. The
        tenant's latest QR, when still pending, is marked as being checked (getPaymentStatus
        answers checking from then on, "Sedang dicek") and AutoGoPay is asked about it once: paid
        records the payment (answer paid), expired or cancelled closes it (answer expired),
        still pending answers checking and reconcile asks again within 30 minutes. When AutoGoPay
        cannot answer, or the tenant checked 5 times in 10 minutes, the answer is checking and
        reconcile resolves it. A QR that is no longer pending answers its status. While checking,
        a QR that has not expired can still be shown from getPaymentQRImage. 404 qris_not_found
        when the tenant has no QR; 409 qris_busy as for createPaymentQris. Limited per token and
        per client address together with getPaymentPage (429 rate_limited). Responses carry
        Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrisStatus" }
        "404":
          description: "No working link with this token (code payment_link_not_found), or no QR yet (code qris_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "A QR is being made or checked right now (code qris_busy)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link expired (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/promise:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    post:
      tags: [payment-page]
      operationId: makePaymentPromise
      summary: The tenant promises to pay what is left (public; "Simpan janji")
      description: >
        No session: the token grants it, and link errors answer as for getPaymentPage. A promise
        belongs to the tenant and covers every invoice still owing now, whichever of the tenant's
        links is used. When the tenant has an active promise this adds its next version (an
        edit, "Ubah janji"); otherwise it makes a new one. Saved before paying (decision 41.1):
        payingNow is what the tenant pays right after saving ("Simpan janji, lalu bayar Rp X"),
        so it is not part of the promised rest; empty promisedAmount means everything still owed
        after it.


        specific_date takes promisedDate from tomorrow to 60 days ahead (Asia/Jakarta), the
        bounds getPaymentPage gives as promiseDates. An edit may not go past 60 days from the
        day the promise's first version was made, so editing never extends a promise beyond
        that (decision 41); once that day is reached no edit is possible until the promise
        closes. with_next_invoice takes no date: the server
        uses the next invoice's due date, which getPaymentPage gives as nextInvoiceDueDate (null
        when the tenant has none within the range, so the page does not offer it). Limited per
        token and per client address together with getPaymentPage (429 rate_limited). Responses
        carry Cache-Control: no-store and Referrer-Policy: no-referrer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakePaymentPromiseRequest" }
      responses:
        "200":
          description: The active promise, its newest version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPromise" }
        "400":
          description: >
            invalid_input (field kind, promisedDate, promisedAmount or payingNow): no kind, a
            missing promisedDate for specific_date or one sent for with_next_invoice, an amount
            below its minimum. promise_date_out_of_range (field promisedDate): the date is not from
            tomorrow to 60 days ahead, or the next invoice is due later than that.
            promise_no_next_invoice (field kind): no lease will bill again.
            promise_amount_above_outstanding (field payingNow or promisedAmount): payingNow is more
            than the tenant owes, or promisedAmount more than what is left after it. A body that is
            not the documented JSON, or names an unknown field, is invalid_json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "No working link with this token (code payment_link_not_found)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "The tenant owes nothing, or nothing is left after payingNow (code promise_nothing_owed)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link expired (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /t/{token}/telegram:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret in the payment link. Never log it or send it anywhere else.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    post:
      tags: [payment-page]
      operationId: linkPaymentPageTelegram
      summary: A one-time deep link to the Telegram bot, to get messages there (public; "Hubungkan Telegram")
      description: >
        Telegram is a demo channel (decision 42): development and staging, with test accounts.
        No session: the token grants it, and link errors answer as for getPaymentPage. Answers
        the bot's deep link, https://t.me/<bot>?start=<code>. The code is fresh randomness, never
        the link token or anything derived from it; it works once and for 10 minutes, and asking
        again makes another without cancelling the first. Opening the link and pressing Start in
        Telegram links that chat to the tenant (getPaymentPage then shows telegram.linked); a new
        link replaces the tenant's older one, and /stop in the chat unlinks it. 404
        telegram_unavailable when the environment has no bot or does not send to linked chats
        (TELEGRAM_MESSAGES off), so the page hides the button
        (getPaymentPage's telegram.available is false then). Limited per token and per client
        address together with getPaymentPage (429 rate_limited). Responses carry Cache-Control:
        no-store and Referrer-Policy: no-referrer. The deep link holds the code: open it, never
        log it or send it anywhere else.
      security: []
      responses:
        "200":
          description: The deep link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramDeepLink" }
        "404":
          description: "No working link with this token (code payment_link_not_found), or no bot in this environment or it does not send to linked chats (code telegram_unavailable)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "The link expired (code payment_link_expired)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    # Every list that can grow is paginated with Page and PageSize and answers a Page with its
    # items. Out-of-range values, an unknown sort or an unknown filter value are a 400
    # invalid_input naming the parameter in field.
    Page:
      name: page
      in: query
      description: The page to return, from 1. A page past the last has no items.
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Period:
      name: period
      in: query
      description: A month, YYYY-MM; this month in Asia/Jakarta when empty. A bad value is a 400 with field period.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11" }
    Search:
      name: q
      in: query
      description: Search text, ignoring case; empty means no search.
      schema: { type: string, maxLength: 100 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_code
            message:
              type: string
              example: Kode salah atau sudah kedaluwarsa.
            field:
              type: string
              description: The input field the error is about, when there is one.

    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: sent }

    LoginCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Any common Indonesian format, for example 0812-3456-7890 or +62 812 3456 7890.
          example: 0812-3456-7890
        whatsappOnly:
          type: boolean
          default: false
          description: >
            "Kirim lewat WhatsApp": send the code over WhatsApp even when the staff member linked
            Telegram. Counts against the same per-number limit.

    LoginCodeAccepted:
      type: object
      required: [status, telegramAvailable]
      properties:
        status: { type: string, example: sent }
        telegramAvailable:
          type: boolean
          description: >
            True when this environment sends login codes to staff members' linked Telegram chats
            (a demo environment with a bot and TELEGRAM_MESSAGES=linked, decision 42), so the login
            screen says "Kode dikirim lewat Telegram atau WhatsApp" and offers "Kirim lewat
            WhatsApp". An environment setting: identical for every number, registered or not,
            linked or not, and with or without whatsappOnly. Always false in production.

    LoginCodeVerify:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string, example: 0812-3456-7890 }
        code: { type: string, pattern: "^[0-9]{6}$", example: "123456" }

    User:
      type: object
      required: [id, name, phone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, description: E.164 }

    Organization:
      type: object
      required: [id, name, displayName]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }

    MeResponse:
      type: object
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }

    RoleRef:
      type: object
      required: [key, name, builtin]
      properties:
        key: { type: string, example: admin }
        name: { type: string, example: Admin }
        builtin: { type: boolean }
        propertyId:
          type: string
          format: uuid
          description: Set when the role is limited to this property; absent means the whole organization.
        propertyName:
          type: string
          description: The name of the property in propertyId, set with it, so a role reads "Admin · Kos Melati" without the property list.
          example: Kos Melati

    Capability:
      type: object
      required: [action, access]
      properties:
        action: { type: string, example: "member:invite" }
        access:
          type: string
          enum: [allow, conditional, deny]

    OrgMeResponse:
      type: object
      required: [membershipId, roles, capabilities]
      properties:
        membershipId: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleRef" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }

    Member:
      type: object
      required: [id, userId, name, phone, status, roles, createdAt, invitation, firstSignInAt, collectorLeaseCount]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        status: { $ref: "#/components/schemas/MemberStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleRef" }
        createdAt: { type: string, format: date-time }
        invitation:
          description: >
            The WhatsApp invitation, or null for a member who was never invited (the
            organization's founders).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Invitation"
        firstSignInAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the member first opened this organization after signing in (their first
            getOrgMe here); null until they have. Each organization sees only its own, so it
            never reveals that a number belongs to another organization.
        collectorLeaseCount:
          type: integer
          format: int64
          minimum: 0
          description: >
            How many active leases in this organization name this member as collector, on every
            property. It is organization-wide because it is a count with no names or tenant data
            and the members list is organization-level (member:read for the whole organization;
            a role limited to one property cannot list members); reassigning still needs
            lease:manage on each lease. A disabled
            member keeps the leases they collect until an admin picks another collector with
            updateLease, so a disabled member with a count above 0 is shown as "N penyewa belum
            punya penagih".

    Invitation:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: >
            sent: the last send reached WhatsApp. not_sent: the member was invited but the last
            send failed or was refused (rate limit), so the screen offers a resend.
          enum: [sent, not_sent]
        lastSentAt:
          type: string
          format: date-time
          description: When the invitation last reached WhatsApp. Absent if it never did.

    MemberStatus:
      type: string
      description: A disabled member keeps their roles but can do nothing in the organization.
      enum: [active, disabled]

    SetMemberStatus:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/MemberStatus" }

    CollectorCandidate:
      type: object
      required: [memberId, name, karyawan]
      properties:
        memberId: { type: string, format: uuid, description: "The value for LeaseTerms.collectorMemberId." }
        name: { type: string }
        karyawan: { type: boolean, description: "True when the member holds the karyawan role, anywhere in the organization." }

    CollectorCandidateList:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CollectorCandidate" }

    PageInfo:
      type: object
      description: "One page of a list. Rows are in a fixed order, ties broken by id, so pages never overlap or skip."
      required: [page, pageSize, total]
      properties:
        page: { type: integer, description: "The page returned, from 1." }
        pageSize: { type: integer }
        total: { type: integer, description: "Every row matching the filters that the member may see, on all pages." }

    MemberList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Member" }

    InviteMember:
      type: object
      required: [phone, name, roles]
      properties:
        phone: { type: string }
        name: { type: string, maxLength: 100 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }

    SetRoles:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }

    RoleGrant:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [supervisor, admin, karyawan]
        propertyId:
          type: string
          format: uuid
          description: Limits the role to this property. Leave it out for the whole organization.

    PropertyKind:
      type: string
      enum: [kos, kontrakan, ruko, other]

    PropertyInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100, example: Kos Melati }
        kind: { $ref: "#/components/schemas/PropertyKind" }
        address: { type: string, maxLength: 300, example: "Jl. Melati No. 12, Sleman" }

    Property:
      type: object
      required: [id, name, kind, address, unitCount, occupiedUnitCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PropertyKind" }
        address: { type: string }
        unitCount: { type: integer, format: int64 }
        occupiedUnitCount:
          type: integer
          format: int64
          description: >
            How many of the property's units have an active lease, a booking that has not started
            yet included. It counts units, not who may see their tenants, so it is the same for every
            member who can read the property.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PropertyList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Property" }

    UnitInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 50
          description: Unique inside its property, ignoring case.
          example: Kamar 11
        terms:
          type: array
          minItems: 1
          maxItems: 5
          description: >
            The billing terms the unit offers (decisions 32 and 33), each month count once: any of
            the standard terms 1, 3, 6 and 12 months, plus at most one custom term of 2 to 60
            months the admin types. On createUnit,
            leaving it out offers the property kind's default: 12 months for a ruko, 1 month for
            a kos, kontrakan or other unit, with no price yet. On updateUnit, leaving it out keeps
            the offered terms and their prices. When given, the unit offers exactly these terms;
            a lease keeps its term when the unit stops offering it. A term's price, when given and
            different from the price in force today, is recorded as a new price effective today
            (use createUnitPrice for a later date). An empty list, a repeated month count, one
            outside 1 to 60, or a second custom term is a 400 invalid_input on field terms.
            Replacing the custom term with another month count works like switching a term off:
            leases on the old one keep it, and its price history stays.
          items: { $ref: "#/components/schemas/UnitTermInput" }

    TermMonths:
      type: integer
      minimum: 1
      maximum: 60
      description: >
        A billing term in months. The lease is billed once per term, in advance. The standard
        terms are 1, 3, 6 and 12 (decision 32); any other value is the unit's one custom term,
        2 to 60 months (decision 33).
      example: 12

    UnitTermInput:
      type: object
      required: [months]
      properties:
        months: { $ref: "#/components/schemas/TermMonths" }
        price:
          type: integer
          format: int64
          minimum: 1
          description: Rent for one whole term in rupiah, typed by the owner (not months times a monthly rent).
          example: 15000000

    UnitTerm:
      type: object
      required: [months]
      properties:
        months: { $ref: "#/components/schemas/TermMonths" }
        price:
          type: integer
          format: int64
          description: >
            Rent for one whole term in rupiah, in force today (Asia/Jakarta). Missing when no
            price is in force yet; a lease on this term needs one.
          example: 15000000
        nextPrice: { $ref: "#/components/schemas/ScheduledPrice" }

    ScheduledPrice:
      type: object
      description: The next price change after today, when one is scheduled.
      required: [amount, effectiveFrom]
      properties:
        amount: { type: integer, format: int64, example: 16000000 }
        effectiveFrom: { type: string, format: date, example: "2027-01-01" }

    UnitPriceInput:
      type: object
      required: [months, amount, effectiveFrom]
      properties:
        months: { $ref: "#/components/schemas/TermMonths" }
        amount: { type: integer, format: int64, minimum: 1, example: 16000000 }
        effectiveFrom:
          type: string
          format: date
          example: "2027-01-01"
          description: >
            The first day the price applies: today (Asia/Jakarta) or later, and from slice 2 after
            the day the unit's newest invoice was made. An invoice takes the price in force on the
            day it is made.

    UnitPrice:
      type: object
      required: [id, months, amount, effectiveFrom, recordedAt]
      properties:
        id: { type: string, format: uuid }
        months: { $ref: "#/components/schemas/TermMonths" }
        amount: { type: integer, format: int64, example: 15000000 }
        effectiveFrom: { type: string, format: date }
        recordedAt: { type: string, format: date-time }
        recordedByName:
          type: string
          description: >
            The name of the member who recorded the price. Missing for the prices moved over from
            each unit's usual rent and its lease's rent when terms were introduced.

    UnitPriceHistory:
      type: array
      description: >
        A unit's whole price history, the latest effective date first and, on the same date, the
        latest recorded first; the first row for a term on or before today is its price in force.
        Rows are never changed or removed. A plain array: a unit gathers a few rows a year.
      items: { $ref: "#/components/schemas/UnitPrice" }

    UnitTenant:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Unit:
      type: object
      required: [id, propertyId, label, terms, occupied, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        label: { type: string }
        terms:
          type: array
          description: The terms the unit offers, fewest months first, each with its price in force today. At least one.
          items: { $ref: "#/components/schemas/UnitTerm" }
        occupied:
          type: boolean
          description: >
            True while the unit has an active lease, a booking that has not started yet included.
            False for a free unit and for one whose lease has ended.
        currentTenant:
          description: >
            The tenant of the unit's active lease. Absent when the unit is free, and also when the
            viewer may not read that tenant: it is shown only when tenant:read is allowed on the
            lease's tenant, the same per-record check the tenant list uses (a karyawan through the
            lease's collector, a member limited to a property through that property). A custom role
            with unit:read but no tenant:read gets `occupied` only.
          $ref: "#/components/schemas/UnitTenant"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UnitList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Unit" }

    TenantInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 100, example: Rina Wulandari }
        phone:
          type: string
          description: WhatsApp number in any common Indonesian format; stored as E.164.
          example: 0812-3456-7890
        note: { type: string, maxLength: 500 }

    Tenant:
      type: object
      required: [id, name, phone, note, leases, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, description: E.164 }
        note: { type: string }
        leases:
          type: array
          description: The leases the member may see, active first.
          items: { $ref: "#/components/schemas/Lease" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TenantList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Tenant" }

    LeaseStatus:
      type: string
      enum: [active, ended]

    Collector:
      type: object
      required: [memberId, name, active]
      properties:
        memberId: { type: string, format: uuid }
        name: { type: string }
        active:
          type: boolean
          description: >
            False when the member is disabled in the organization. The lease keeps them as
            collector until an admin picks another one with updateLease. The web counts the
            flagged tenants with listTenants and collectorDisabled=true, which answers the total.

    Lease:
      type: object
      required: [id, tenantId, unitId, unitLabel, propertyId, propertyName, startDate, enteredOn, billedFrom, termMonths, depositAmount, status, charges, meteredChargeTypes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        unitLabel: { type: string }
        propertyId: { type: string, format: uuid }
        propertyName: { type: string }
        startDate:
          type: string
          format: date
          description: >
            First day of the lease. Rent is billed in advance once per term, on this day of the
            month every termMonths months (the last day of a shorter month when it is the 29th to
            31st).
        endDate: { type: string, format: date, description: "Last day of the lease, set by move-out." }
        enteredOn:
          type: string
          format: date
          description: >
            The day the lease was saved, in Asia/Jakarta, set by the server. A lease whose start
            date is before it was entered late: from slice 2 its past periods are due on this day.
        billedFrom:
          type: string
          format: date
          description: >
            "Mulai tagih dari": the first period the app invoices, a period start of the lease's
            term. It equals the start date unless the admin skipped periods the owner collected by
            hand.
        plannedEndDate:
          type: string
          format: date
          description: >
            "Rencana keluar": the tenant's planned last day, set with setLeasePlannedEnd. Missing
            when none is set; cleared by move-out.
        termMonths: { $ref: "#/components/schemas/TermMonths" }
        periodRent:
          type: integer
          format: int64
          description: >
            Rent for one period of the lease's term, for display: the unit's price for that term in
            force today (Asia/Jakarta). Missing when none is in force. Each invoice takes the price
            in force on the day it is made; the lease holds no rent of its own.
          example: 15000000
        depositAmount: { type: integer, format: int64, description: "Deposit held, in rupiah." }
        status: { $ref: "#/components/schemas/LeaseStatus" }
        collector: { $ref: "#/components/schemas/Collector" }
        charges:
          type: array
          description: >
            Fixed monthly extras on top of rent, by name. Always present, empty when none. From
            slice 2 an invoice bills each one as its monthly amount times the term's months.
          items: { $ref: "#/components/schemas/LeaseCharge" }
        meteredChargeTypes:
          type: array
          description: >
            The metered types the lease expects an amount for every month ("dicatat dari meteran
            tiap bulan"), by name. Always present, empty when none. Set with setLeaseCharges.
          items: { $ref: "#/components/schemas/LeaseMeteredType" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LeaseMeteredType:
      type: object
      required: [chargeTypeId, name]
      properties:
        chargeTypeId: { type: string, format: uuid }
        name: { type: string, example: Listrik }

    LeaseCharge:
      type: object
      required: [chargeTypeId, name, amount]
      properties:
        chargeTypeId: { type: string, format: uuid }
        name: { type: string, example: Wi-Fi }
        amount: { type: integer, format: int64, description: Monthly amount in rupiah., example: 50000 }

    LeaseChargeInput:
      type: object
      required: [chargeTypeId, amount]
      properties:
        chargeTypeId: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1, description: Monthly amount in rupiah., example: 50000 }

    LeaseChargesInput:
      type: object
      required: [charges]
      properties:
        charges:
          type: array
          maxItems: 20
          description: The lease's whole set of fixed extras; each charge type at most once.
          items: { $ref: "#/components/schemas/LeaseChargeInput" }
        meteredChargeTypeIds:
          type: array
          maxItems: 20
          description: >
            The lease's whole set of expected metered types, each a metered charge type at most
            once. Left out, the set stays as it is; an empty list removes them all.
          items: { type: string, format: uuid }

    ChargeTypeInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique in the organization, ignoring case. Leading and trailing spaces are dropped.
          example: Wi-Fi
        metered:
          type: boolean
          description: >
            True when the amount differs every month and is recorded from a meter. Metered types
            cannot be fixed lease charges. Defaults to false.

    ChargeType:
      type: object
      required: [id, name, metered, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        metered: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChargeTypeList:
      type: object
      required: [chargeTypes]
      properties:
        chargeTypes:
          type: array
          items: { $ref: "#/components/schemas/ChargeType" }

    LeaseTerms:
      type: object
      required: [startDate]
      properties:
        startDate: { type: string, format: date, example: "2026-11-15", description: "Also the day of the month rent is due, once per term." }
        depositAmount: { type: integer, format: int64, minimum: 0, description: Defaults to 0. }
        collectorMemberId:
          type: string
          format: uuid
          description: >
            The member (Member.id) who collects from this tenant. Leave it out for none. The
            member must be active, except on updateLease when it is the lease's current
            collector, so a lease whose collector was disabled can still be edited while it
            keeps them. A different disabled member is refused (field collectorMemberId).
        billedFrom:
          type: string
          format: date
          example: "2026-10-15"
          description: >
            "Mulai tagih dari": the first period to invoice, to skip periods the owner collected
            by hand. It must be a period start of the lease's term (the start date itself, or the
            same day a whole number of terms later, the last day of a shorter month for a start on
            the 29th to 31st), and no later than the first period start after the later of the
            start date and the day the lease was entered. On createLease, leaving it out bills
            from the start date. On updateLease, leaving it out (or null) keeps the stored value,
            so editing another term never undoes a skipped billing start; to bill from the start
            date again, send the start date. When a changed start date no longer fits the kept
            value, the update is refused on billedFrom. Errors use field billedFrom.

    LeasePlannedEnd:
      type: object
      required: [plannedEndDate]
      properties:
        plannedEndDate:
          type: string
          format: date
          nullable: true
          example: "2026-11-14"
          description: >
            The tenant's last day. To stop before a new month, pick the day before the next
            anniversary. null clears it; the key is required, so an empty body never clears it by
            mistake. Errors use field plannedEndDate.

    LeaseInput:
      allOf:
        - $ref: "#/components/schemas/LeaseTerms"
        - type: object
          required: [tenantId, unitId, termMonths]
          properties:
            tenantId: { type: string, format: uuid }
            unitId: { type: string, format: uuid }
            termMonths:
              $ref: "#/components/schemas/TermMonths"
              description: >
                One of the terms the unit offers, with a price in force today; fixed for the life
                of the lease (another term is a new lease).

    MoveOut:
      type: object
      required: [endDate]
      properties:
        endDate: { type: string, format: date, example: "2026-11-30" }

    ImportAction:
      type: string
      enum: [created, matched]

    ImportRowError:
      type: object
      required: [column, message]
      properties:
        column: { type: string, description: "The CSV column the error is about, by its canonical name.", example: phone }
        message: { type: string, example: Nomor WhatsApp tidak valid. }

    ImportRow:
      type: object
      required: [line, status, errors, notes, propertyName, unitLabel, tenantName, invoiceCount, invoiceTotal]
      properties:
        line: { type: integer, description: "Line number in the file, counting the header as line 1." }
        status:
          type: string
          enum: [ok, error]
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportRowError" }
        notes:
          type: array
          description: Things worth a look that are not errors, such as an existing lease whose terms differ from the row.
          items: { type: string }
        property: { $ref: "#/components/schemas/ImportAction" }
        unit: { $ref: "#/components/schemas/ImportAction" }
        tenant: { $ref: "#/components/schemas/ImportAction" }
        lease: { $ref: "#/components/schemas/ImportAction" }
        values: { $ref: "#/components/schemas/ImportRowValues" }
        propertyName: { type: string, description: "The properti cell as read from the file, trimmed; empty when the cell is empty." }
        unitLabel: { type: string, description: "The kamar cell as read from the file, trimmed; empty when the cell is empty." }
        tenantName: { type: string, description: "The nama_penyewa cell as read from the file, trimmed; empty when the cell is empty." }
        invoiceCount:
          type: integer
          description: >
            How many invoices the lease this row creates gets once the import is saved, as invoice
            generation makes them today: every period from mulai_tagih (the start date when empty)
            whose due date is within 7 days. A lease entered late gets all its past periods, so a
            large number here usually means mulai_tagih is missing. 0 when the row creates no lease
            (an existing lease is matched, or the row has errors) or a booking starts later.
        invoiceTotal:
          type: integer
          format: int64
          description: What those invoices bill in total, in rupiah (rent plus fixed charges). 0 with invoiceCount 0.

    ImportRowValues:
      type: object
      description: >
        The lease terms as the API read them from the row, so a dry run shows exactly what will be
        saved (for example a date read day first). Missing when the row's term, rent, deposit or
        start date could not be read or resolved.
      required: [startDate, billedFrom, termMonths, depositAmount]
      properties:
        startDate: { type: string, format: date }
        billedFrom: { type: string, format: date, description: "Mulai tagih dari; the start date when the cell is empty." }
        termMonths:
          $ref: "#/components/schemas/TermMonths"
          description: >
            The jangka_bulan cell (1 to 60: a standard term or a custom one, decision 33), or when
            it is empty: 1 when the unit offers it, else the unit's only term; a unit the import
            creates offers the row's term, or its property kind's default when the cell is empty
            (12 for a ruko, otherwise 1). A term an existing unit does not offer is a row error on
            column term.
        rentAmount:
          type: integer
          format: int64
          description: >
            The sewa cell: the unit's price for one whole term. Required when the unit has no price
            for the term in force on the import day, and then recorded as its price from that day;
            when the unit has one, it may be empty, and a different amount is a row error on column
            rent. Missing when the cell is empty.
        depositAmount: { type: integer, format: int64, description: "Deposit in rupiah; 0 when the cell is empty." }

    ImportSummary:
      type: object
      required: [rows, rowsWithErrors, propertiesCreated, unitsCreated, tenantsCreated, leasesCreated, leasesMatched, invoiceCount, invoiceTotal]
      properties:
        rows: { type: integer }
        rowsWithErrors: { type: integer }
        propertiesCreated: { type: integer }
        unitsCreated: { type: integer }
        tenantsCreated: { type: integer }
        leasesCreated: { type: integer }
        leasesMatched: { type: integer }
        invoiceCount: { type: integer, description: "The rows' invoiceCount added up: the invoices the whole file creates." }
        invoiceTotal: { type: integer, format: int64, description: "The rows' invoiceTotal added up, in rupiah." }

    ImportWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [old_due_day_column, no_bill_from_column]
          description: >
            old_due_day_column: the file has the older jatuh_tempo (due_day) column, which is ignored.
            no_bill_from_column: the file has no mulai_tagih (bill_from) column, so every row bills
            from its start date.
        message: { type: string, description: "In Bahasa Indonesia, safe to show to the user." }

    ImportResult:
      type: object
      required: [dryRun, committed, summary, warnings, rows]
      properties:
        dryRun: { type: boolean }
        committed: { type: boolean, description: True only when the rows were saved. }
        summary: { $ref: "#/components/schemas/ImportSummary" }
        warnings:
          type: array
          description: Things about the file as a whole worth a look that are not errors. Empty when there are none; a dry run and a commit return the same ones.
          items: { $ref: "#/components/schemas/ImportWarning" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }

    StaffRef:
      type: object
      required: [memberId, name]
      description: The member who recorded or created a row.
      properties:
        memberId: { type: string, format: uuid }
        name: { type: string }

    InvoiceStatus:
      type: string
      enum: [open, partial, paid, cancelled]
      description: >
        open: nothing paid; partial: some paid; paid: fully paid; cancelled: corrected to zero.
        Whether an open or partial invoice is overdue follows from its dueDate (debt from the
        day after it, Asia/Jakarta).

    InvoiceKind:
      type: string
      enum: [regular, final]
      description: >
        regular: bills one period of the lease's term. final: the one invoice made at move-out for
        metered usage no regular invoice billed; its period and periodEnd are the lease's last day,
        so it belongs to the month the tenant left, and it is due on the move-out day.

    InvoiceLine:
      type: object
      required: [id, kind, label, amount]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [rent, charge]
        label: { type: string, example: "Sewa 15 Okt 2026 – 14 Nov 2026" }
        amount: { type: integer, format: int64, description: "Rupiah, as snapshotted when the invoice was made." }
        meteredChargeId:
          type: string
          format: uuid
          description: The metered amount a charge line bills ("Listrik Oktober 2026"); missing for every other line.

    Correction:
      type: object
      required: [id, amountDelta, reason, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid, description: Set when it corrects an invoice. }
        paymentId: { type: string, format: uuid, description: Set when it corrects a payment. }
        amountDelta: { type: integer, format: int64, description: "Signed rupiah, never 0.", example: -700000 }
        reason: { type: string, example: sewa tidak diperpanjang }
        createdBy: { $ref: "#/components/schemas/StaffRef" }
        createdAt: { type: string, format: date-time }

    AccountInvoice:
      type: object
      required: [id, kind, leaseId, unitLabel, propertyName, period, periodEnd, dueDate, issuedOn, amount, billed, paid, outstanding, status, lines, corrections]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        leaseId: { type: string, format: uuid }
        unitLabel: { type: string }
        propertyName: { type: string }
        period: { type: string, format: date, description: "The period's first day; the invoice belongs to its month (Tagihan November)." }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        issuedOn: { type: string, format: date, description: "The day the invoice was made, Asia/Jakarta (terbit)." }
        amount: { type: integer, format: int64, description: What it billed when made (the sum of its lines). }
        billed: { type: integer, format: int64, description: amount plus its corrections. }
        paid: { type: integer, format: int64, description: What payments allocated to it. }
        outstanding: { type: integer, format: int64, description: billed minus paid. }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        corrections:
          type: array
          description: Oldest first. Empty when none.
          items: { $ref: "#/components/schemas/Correction" }

    TenantOpenInvoice:
      type: object
      required: [id, kind, period, periodEnd, dueDate, unitLabel, propertyName, amount, balance]
      description: One invoice of a tenant that still owes something.
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        period: { type: string, format: date, description: "The period's first day; the invoice belongs to its month (Tagihan November)." }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        unitLabel: { type: string }
        propertyName: { type: string }
        amount: { type: integer, format: int64, description: "What it bills now, rupiah: what it billed when made plus its corrections." }
        balance: { type: integer, format: int64, description: "What it still owes, rupiah: amount minus what payments allocated to it; always above 0." }

    PaymentMethod:
      type: string
      enum: [cash, transfer, qris, va]
      description: A payment recorded by hand is cash or transfer; qris and va come from slice 3.

    PaymentAllocation:
      type: object
      required: [invoiceId, amount]
      description: What a payment pays on one invoice now, after any reversal. Only non-zero ones are listed.
      properties:
        invoiceId: { type: string, format: uuid }
        amount: { type: integer, format: int64 }

    AccountPayment:
      type: object
      required: [id, amount, net, method, receivedOn, note, allocations, corrections, createdAt]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: "What was received, as recorded." }
        net: { type: integer, format: int64, description: amount plus its corrections. }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        receivedOn: { type: string, format: date, description: "The day the money was received, Asia/Jakarta." }
        note: { type: string, description: Empty when none. }
        recordedBy: { $ref: "#/components/schemas/StaffRef" }
        allocations:
          type: array
          description: Oldest invoice first. Empty when it is all credit.
          items: { $ref: "#/components/schemas/PaymentAllocation" }
        corrections:
          type: array
          description: Oldest first. Empty when none.
          items: { $ref: "#/components/schemas/Correction" }
        createdAt: { type: string, format: date-time }

    AccountTotals:
      type: object
      required: [outstanding, overdue, credit]
      properties:
        outstanding:
          type: integer
          format: int64
          description: What the tenant still owes over all their invoices, due or not yet due ("Total belum dibayar").
        overdue:
          type: integer
          format: int64
          description: >
            The part of outstanding that is debt ("Tunggakan"): what is still owed on invoices whose
            due date is before today in Asia/Jakarta (debt from the day after the due date).
        oldestUnpaidDueDate:
          type: string
          format: date
          description: The due date of the oldest invoice not fully paid. Missing when nothing is owed.
        credit:
          type: integer
          format: int64
          description: Money paid and not yet used by any invoice; it pays the next invoice when made.

    TenantAccount:
      allOf:
        - $ref: "#/components/schemas/AccountTotals"
        - type: object
          required: [tenantId, invoices, payments, activePromise, brokenPromises, promiseDates, nextInvoiceDueDate]
          properties:
            tenantId: { type: string, format: uuid }
            invoices:
              type: array
              description: Oldest period first, cancelled ones included.
              items: { $ref: "#/components/schemas/AccountInvoice" }
            payments:
              type: array
              description: Oldest received first.
              items: { $ref: "#/components/schemas/AccountPayment" }
            activePromise:
              description: >
                The newest version of the tenant's active payment promise, or null when the tenant
                has none. It stays active until it is closed, even once everything is paid.
              nullable: true
              allOf:
                - $ref: "#/components/schemas/ActivePromise"
            brokenPromises:
              type: integer
              minimum: 0
              description: How many of the tenant's promises closed broken, ever; 0 when none did.
            promiseDates:
              description: >
                The days a promise made now may name, exactly as the payment page gives them: for
                an edit of the active promise, no later than 60 days from its first version. Null
                when no promise can be made now: the tenant owes nothing, or the active promise
                has reached that bound.
              nullable: true
              allOf:
                - $ref: "#/components/schemas/PromiseDates"
            nextInvoiceDueDate:
              type: string
              format: date
              nullable: true
              description: >
                The due date a with_next_invoice promise made now would take, the same value as
                the payment page's nextInvoiceDueDate. Null when the tenant owes nothing, no lease
                will bill again, or it is after promiseDates.latest (or promiseDates is null).

    PaymentInput:
      type: object
      required: [requestId, tenantId, amount, method, receivedOn]
      properties:
        requestId:
          type: string
          format: uuid
          description: >
            Made by the client once per payment form it opens, and sent again unchanged on a
            retry. Errors use field requestId.
        tenantId: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000000, example: 700000 }
        method:
          type: string
          enum: [cash, transfer]
        receivedOn:
          type: string
          format: date
          description: Today or earlier in Asia/Jakarta; a later day is a 400 with field receivedOn.
          example: "2026-11-02"
        note: { type: string, maxLength: 500, description: "Optional, for example \"BCA atas nama suami\"." }

    PaidInvoice:
      type: object
      required: [invoiceId, kind, period, periodEnd, dueDate, amount, outstanding]
      description: One invoice a payment paid, and what that invoice still owes now.
      properties:
        invoiceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        period: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        amount: { type: integer, format: int64, description: What this payment paid on it. }
        outstanding: { type: integer, format: int64, description: "What the invoice still owes, 0 when paid in full." }

    PaymentResult:
      allOf:
        - $ref: "#/components/schemas/AccountTotals"
        - type: object
          required: [payment, paid]
          properties:
            payment: { $ref: "#/components/schemas/AccountPayment" }
            paid:
              type: array
              description: The invoices the payment paid, oldest period first. Empty when it all went to credit.
              items: { $ref: "#/components/schemas/PaidInvoice" }

    CorrectionInput:
      type: object
      required: [requestId, reason]
      description: >
        Exactly one of invoiceId and paymentId (400 with field invoiceId otherwise), and exactly
        one of newAmount and amountDelta (400 with field newAmount otherwise).
      properties:
        requestId:
          type: string
          format: uuid
          description: >
            As in PaymentInput. A repeat compares what was sent (newAmount or amountDelta), so a
            repeated newAmount answers the stored correction even though the amount now equals it.
        invoiceId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        newAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: >
            What the invoice should bill or the payment should count, in rupiah ("Nominal baru");
            0 cancels an invoice. The server takes the difference from the current amount inside
            the transaction, so a correction or payment saved meanwhile is never overwritten by a
            stale figure. Equal to the current amount is a 409 correction_no_change.
          example: 1400000
        amountDelta:
          type: integer
          format: int64
          minimum: -1000000000000
          maximum: 1000000000000
          description: Signed rupiah, not 0. Negative bills or counts less, positive more.
          example: -200000
        reason: { type: string, minLength: 1, maxLength: 500, description: Required; blank is a 400. }

    CorrectionResult:
      allOf:
        - $ref: "#/components/schemas/AccountTotals"
        - type: object
          required: [correction, tenantId]
          properties:
            correction: { $ref: "#/components/schemas/Correction" }
            tenantId: { type: string, format: uuid }

    UnitRef:
      type: object
      required: [propertyName, unitLabel]
      properties:
        propertyName: { type: string, example: Kos Melati }
        unitLabel: { type: string, example: Kamar 11 }

    TenantArrears:
      type: object
      required: [tenantId, tenantName, units, overdue, oldestUnpaidDueDate, ageDays]
      description: A tenant who owes money after its due date.
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        units:
          type: array
          description: The units of the overdue invoices, by property then unit.
          items: { $ref: "#/components/schemas/UnitRef" }
        overdue: { type: integer, format: int64, description: "What the tenant owes after the due dates, in rupiah." }
        oldestUnpaidDueDate: { type: string, format: date }
        ageDays:
          type: integer
          description: "Days since the oldest unpaid due date, in Asia/Jakarta: 1 on the day after it (Terlambat 1 hari)."

    DashboardCorrection:
      type: object
      required: [id, tenantId, tenantName, amountDelta, reason, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        invoiceId: { type: string, format: uuid, description: Set when it corrects an invoice. }
        period: { type: string, format: date, description: "The corrected invoice's period start; set with invoiceId." }
        unit: { $ref: "#/components/schemas/UnitRef" }
        paymentId: { type: string, format: uuid, description: Set when it corrects a payment. }
        receivedOn: { type: string, format: date, description: "The corrected payment's received day; set with paymentId." }
        amountDelta: { type: integer, format: int64, description: Signed rupiah. }
        reason: { type: string }
        createdBy: { $ref: "#/components/schemas/StaffRef" }
        createdAt: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [period, billed, collected, outstanding, invoiceCount, tenantsOutstanding, overdue, tenantsInArrears, arrears, recentCorrections]
      properties:
        period: { type: string, example: "2026-11", description: "The month shown, YYYY-MM." }
        billed: { type: integer, format: int64, description: "What the month's invoices bill, after corrections." }
        collected: { type: integer, format: int64, description: "What has been paid on the month's invoices." }
        outstanding: { type: integer, format: int64, description: "What the month's invoices still owe (billed minus collected)." }
        invoiceCount: { type: integer, description: "The month's invoices, cancelled ones included." }
        tenantsOutstanding: { type: integer, description: "Tenants with a month's invoice still owing something (Masih kurang ... dari 9 penyewa)." }
        overdue: { type: integer, format: int64, description: "Everything owed after its due date, any month." }
        tenantsInArrears: { type: integer, description: "Tenants who owe something after its due date (Belum bayar · 9 orang)." }
        arrears:
          type: array
          description: Up to 10 tenants in arrears, the oldest debt first, then the most owed. Penagihan with status=overdue lists them all.
          items: { $ref: "#/components/schemas/TenantArrears" }
        recentCorrections:
          type: array
          description: The newest 10 corrections, made by members or by the system (sewa tidak diperpanjang, potong deposit), newest first.
          items: { $ref: "#/components/schemas/DashboardCorrection" }

    InvoiceListItem:
      type: object
      required: [id, kind, tenantId, tenantName, leaseId, propertyId, propertyName, unitLabel, period, periodEnd, dueDate, issuedOn, amount, billed, paid, outstanding, status, overdueDays, pastPlannedEnd, lines, promise, brokenPromises]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        leaseId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyName: { type: string }
        unitLabel: { type: string }
        period: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        issuedOn: { type: string, format: date, description: "The day the invoice was made, Asia/Jakarta (terbit)." }
        amount: { type: integer, format: int64 }
        billed: { type: integer, format: int64 }
        paid: { type: integer, format: int64 }
        outstanding: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        overdueDays:
          type: integer
          description: "Days since the due date while something is still owed (Telat 12 hr), in Asia/Jakarta; 0 when nothing is overdue."
        pastPlannedEnd:
          type: boolean
          description: "The lease is still active after its planned end date (Lewat rencana keluar): the admin should record the move-out or change the date."
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        promise:
          description: >
            The tenant's active payment promise when its newest version covers this invoice
            (the invoice still owed something when that version was made); null when the tenant
            has no active promise or it does not cover this invoice. Its coveredInvoiceIds list
            only the invoices the caller may see.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivePromise"
        brokenPromises:
          type: integer
          minimum: 0
          description: How many of the tenant's promises closed broken, ever; 0 when none did.

    OldestOverdue:
      type: object
      required: [tenantId, tenantName, propertyName, unitLabel, oldestUnpaidDueDate, ageDays]
      description: The tenant whose unpaid debt is oldest (Tunggakan tertua), with the unit of that invoice.
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        propertyName: { type: string }
        unitLabel: { type: string }
        oldestUnpaidDueDate: { type: string, format: date }
        ageDays: { type: integer }

    InvoiceListSummary:
      type: object
      required: [billed, paid, outstanding, tenantsOutstanding, tenantsWithPromise]
      description: >
        The month's invoices in the chosen property (propertyId), whatever status, q and page
        are. oldestOverdue is not tied to the month: the oldest debt now, in the chosen property.
      properties:
        billed: { type: integer, format: int64 }
        paid: { type: integer, format: int64 }
        outstanding: { type: integer, format: int64 }
        tenantsOutstanding: { type: integer, description: Tenants with a month's invoice still owing something. }
        tenantsWithPromise:
          type: integer
          description: "Of the tenants counted in tenantsOutstanding, those with an active payment promise (9 penyewa, 3 ada janji)."
        oldestOverdue: { $ref: "#/components/schemas/OldestOverdue" }

    InvoiceList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items, summary]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/InvoiceListItem" }
            summary: { $ref: "#/components/schemas/InvoiceListSummary" }

    MeteredChargeInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: The rupiah amount billed for the month, typed by the member.
          example: 123000
        meterStart:
          type: integer
          format: int64
          minimum: 0
          description: The meter reading at the start of the month; optional and only shown.
        meterEnd:
          type: integer
          format: int64
          minimum: 0
          description: The meter reading at the end of the month; not below meterStart. Optional and only shown.

    MeteredChargeBilled:
      type: object
      required: [invoiceId, kind, period]
      description: The invoice whose line bills the amount.
      properties:
        invoiceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        period: { type: string, format: date, description: "The invoice's period start (Tagihan November); a final invoice's is the lease's last day." }

    MeteredCharge:
      type: object
      required: [id, leaseId, chargeTypeId, chargeTypeName, usageMonth, amount, recordedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        leaseId: { type: string, format: uuid }
        chargeTypeId: { type: string, format: uuid }
        chargeTypeName: { type: string, example: Listrik }
        usageMonth: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10", description: "The month the usage belongs to, YYYY-MM." }
        amount: { type: integer, format: int64, example: 123000 }
        meterStart: { type: integer, format: int64 }
        meterEnd: { type: integer, format: int64 }
        recordedBy: { $ref: "#/components/schemas/StaffRef" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: When it was last saved. }
        billed:
          $ref: "#/components/schemas/MeteredChargeBilled"

    NextInvoice:
      type: object
      required: [period, issuedOn]
      description: >
        The next invoice generation will make for a lease, which bills every amount recorded
        before it is made: its period start (Tagihan November) and the Asia/Jakarta day it is made,
        7 days before it is due, or today when that day is past.
      properties:
        period: { type: string, format: date }
        issuedOn: { type: string, format: date }

    MeteredChargeList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MeteredCharge" }
            nextInvoice: { $ref: "#/components/schemas/NextInvoice" }

    MissingMeterReading:
      type: object
      required: [leaseId, tenantId, tenantName, propertyName, unitLabel, missing]
      properties:
        leaseId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        propertyName: { type: string }
        unitLabel: { type: string }
        missing:
          type: array
          description: The expected metered types with no amount for the month, by name.
          items: { $ref: "#/components/schemas/LeaseMeteredType" }
        nextInvoice: { $ref: "#/components/schemas/NextInvoice" }

    MissingMeterReadingList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MissingMeterReading" }

    UploadPurpose:
      type: string
      enum: [cash_receipt, cash_deposit]
      description: >
        What the photo is for: cash_receipt, a receipt photo for one tenant's cash payment;
        cash_deposit, a photo of a cash deposit (setor tunai).

    UploadStatus:
      type: string
      enum: [pending, clean, rejected, infected]
      description: >
        pending until the scan has run; clean (can be downloaded); rejected (not a JPEG, PNG or
        WebP image, not the declared size, larger than 10 MB, or the file never arrived);
        infected (malware found; the file is quarantined and an admin sees it). Only pending
        changes, once.

    UploadInput:
      type: object
      required: [purpose, contentType, size]
      properties:
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        tenantId:
          type: string
          format: uuid
          description: Required for cash_receipt; must be left out for cash_deposit.
        contentType:
          type: string
          description: The file's type as the browser reports it; image/jpeg, image/png or image/webp.
          example: image/jpeg
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: The file's exact size in bytes, at most 10 MB (10485760).
          example: 2483120

    Upload:
      type: object
      required: [id, purpose, status, size, createdAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        tenantId: { type: string, format: uuid, description: The tenant of a cash_receipt. }
        status: { $ref: "#/components/schemas/UploadStatus" }
        contentType:
          type: string
          description: The type found in the file's content by the scan; absent while pending.
          example: image/jpeg
        size: { type: integer, format: int64, description: The declared size in bytes. }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, description: When completeUpload was first called. }
        scannedAt: { type: string, format: date-time, description: When the scan decided the status. }
        downloadUrl:
          type: string
          description: >
            Only when status is clean (getUpload only): a short-lived link that downloads the file
            as an attachment. Do not store it; ask getUpload again for a new one.
        downloadExpiresAt: { type: string, format: date-time }

    UploadTicket:
      type: object
      required: [upload, putUrl, putHeaders, putExpiresAt]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
        putUrl:
          type: string
          description: Where to PUT the file body. Valid until putExpiresAt; never log it.
        putHeaders:
          type: object
          additionalProperties: { type: string }
          description: Headers the PUT must carry exactly, such as Content-Type.
          example: { Content-Type: image/jpeg }
        putExpiresAt: { type: string, format: date-time }

    PaymentLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The link to send the tenant, /t/<token> on the web app. Shown once; never log it.
          example: https://app.example.id/t/3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    PaymentLinksRevoked:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, description: How many links were still working and now are not. }

    BankAccount:
      type: object
      required: [bankName, accountNumber, accountHolder]
      description: Where to transfer by hand; the tenant writes their name in the transfer note.
      properties:
        bankName: { type: string, example: BCA }
        accountNumber: { type: string, example: "123 456 7890" }
        accountHolder: { type: string, example: Suhwendi }

    PaymentPageLine:
      type: object
      required: [label, amount]
      properties:
        label: { type: string, example: "Sewa 15 Okt 2026 – 14 Nov 2026" }
        amount: { type: integer, format: int64, description: "Rupiah, as snapshotted when the invoice was made." }

    PaymentPageInvoice:
      type: object
      required: [id, kind, unitLabel, propertyName, period, periodEnd, dueDate, amount, balance, lines]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        unitLabel: { type: string, example: Kamar 11 }
        propertyName: { type: string, example: Kos Melati }
        period: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        amount:
          type: integer
          format: int64
          description: >
            What the invoice bills now, corrections included. Its lines are as the invoice was
            made, so after a correction they may not add up to it.
        balance: { type: integer, format: int64, description: What it still owes; 0 when paid or cancelled. }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PaymentPageLine" }

    PaymentPage:
      type: object
      required: [organizationName, tenantName, invoice, outstanding, credit, paid, openInvoices, bankAccount, qrisAvailable, promise, promiseDates, nextInvoiceDueDate, telegram]
      properties:
        telegram: { $ref: "#/components/schemas/PaymentPageTelegram" }
        promise:
          description: >
            The tenant's active payment promise with its newest version's terms, or null when
            there is none. It stays active until it is closed, even once everything is paid.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentPromise"
        promiseDates:
          description: >
            The days a promise made now may name (specific_date); for an edit of the active
            promise, no later than 60 days from its first version. Null when the tenant owes
            nothing, or when the active promise has reached that bound (no edit is possible).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PromiseDates"
        nextInvoiceDueDate:
          type: string
          format: date
          nullable: true
          description: >
            The due date a with_next_invoice promise would take ("Bareng tagihan berikutnya"):
            the earliest due date after today among the tenant's leases that will still bill,
            whether that invoice is already made or not: the next bill to fall due. The page
            labels the choice by this date, not by a month ("Bareng jatuh tempo berikutnya ·
            13 Nov 2026"): a late-entered lease's current period can be due in the month after
            the one it belongs to. Null when the tenant owes
            nothing, no lease will bill again, or it is after promiseDates.latest; then the page
            does not offer that choice.
        qrisAvailable:
          type: boolean
          description: >
            True when the organization has set up QRIS (an AutoGoPay account), so the page offers
            "Bayar QRIS". False: show bank transfer only, with no outage warning. It says nothing
            about whether AutoGoPay is up; createPaymentQris answers 503 qris_unavailable for that.
        organizationName: { type: string, description: "The organization's display name: who bills the tenant." }
        tenantName: { type: string }
        invoice:
          description: The invoice the link was sent for, whatever its state.
          allOf:
            - $ref: "#/components/schemas/PaymentPageInvoice"
        outstanding:
          type: integer
          format: int64
          description: What the tenant owes over all their invoices; paying pays the oldest first.
        credit: { type: integer, format: int64, description: Money paid and not yet used by any invoice. }
        paid: { type: boolean, description: True when the tenant owes nothing. }
        openInvoices:
          type: array
          description: The invoices that still owe something, oldest period first. Empty when paid.
          items: { $ref: "#/components/schemas/PaymentPageInvoice" }
        bankAccount:
          description: The organization's bank account for a manual transfer, or null when none is set.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BankAccount"

    PaymentPageTelegram:
      type: object
      required: [available, linked]
      description: >
        The Telegram demo channel (decision 42) on the payment page: "Hubungkan Telegram", or
        "Terhubung" once linked.
      properties:
        available:
          type: boolean
          description: True when this environment has a Telegram bot and sends tenants' messages to linked chats, so the page offers linkPaymentPageTelegram.
        linked:
          type: boolean
          description: True when the tenant has a live Telegram link in this organization. Always false when available is false.

    MyTelegram:
      type: object
      required: [available, linked]
      description: >
        The Telegram demo channel (decision 42) on the staff member's account: "Hubungkan
        Telegram", or "Terhubung" once linked.
      properties:
        available:
          type: boolean
          description: True when this environment has a Telegram bot and sends login codes to linked chats (the same as requestLoginCode's telegramAvailable), so the account offers linkMyTelegram.
        linked:
          type: boolean
          description: True when the staff member has a live Telegram link. Always false when available is false.

    TelegramDeepLink:
      type: object
      required: [deepLink]
      properties:
        deepLink:
          type: string
          description: https://t.me/<bot>?start=<code>, with a one-time code valid for 10 minutes.
          example: https://t.me/cashflow_dev_bot?start=Xk3v9q2LrT7mWb8NcY1pZs4uHf6gJd0eKa5oVi2nQwE

    PromiseKind:
      type: string
      enum: [specific_date, with_next_invoice]
      description: >
        specific_date: a day the tenant chose ("Pilih tanggal sendiri"). with_next_invoice: the
        next invoice's due date, set by the server ("Bareng tagihan berikutnya").

    PromiseStatus:
      type: string
      enum: [active, kept, partially_kept, broken]
      description: A tenant has at most one active promise; the others are closed and never change again.

    PromiseSource:
      type: string
      enum: [tenant_page, karyawan, admin]
      # Explicit Go names, so these do not collide with RoleGrantRole's karyawan and admin.
      x-enum-varnames: [PromiseFromTenantPage, PromiseFromKaryawan, PromiseFromAdmin]
      description: Where the version was made. karyawan is used from slice 6.

    PromiseDates:
      type: object
      required: [earliest, latest]
      description: The days a promise made today may name, both included (Asia/Jakarta).
      properties:
        earliest: { type: string, format: date, description: Tomorrow. }
        latest: { type: string, format: date, description: "60 days from today; for an edit, 60 days from the promise's first version if that is sooner." }

    MakePaymentPromiseRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/PromiseKind" }
        promisedDate:
          type: string
          format: date
          description: Required for specific_date, from promiseDates.earliest to promiseDates.latest; never sent for with_next_invoice.
        promisedAmount:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >
            Whole rupiah promised by the date, at most what is owed less payingNow. Missing or null
            means everything still owed after payingNow.
        payingNow:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: What the tenant pays right after saving ("lalu bayar Rp X"), at most what is owed; not part of the promise.

    MakeTenantPromiseRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/PromiseKind" }
        promisedDate:
          type: string
          format: date
          description: Required for specific_date, from tomorrow to 60 days ahead (Asia/Jakarta); never sent for with_next_invoice.
        promisedAmount:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Whole rupiah promised by the date, at most what is owed less payingNow; missing or null means all of it.
        payingNow:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: What the tenant pays right away, at most what is owed; not part of the promise.
        note:
          type: string
          maxLength: 500
          description: The member's note, at most 500 letters after trimming; blank means none.

    PaymentPromise:
      type: object
      required: [status, version, kind, promisedDate, promisedAmount, payingNow, createdAt]
      description: A tenant's promise as the payment page shows it, with its newest version's terms.
      properties:
        status: { $ref: "#/components/schemas/PromiseStatus" }
        version: { type: integer, description: "The newest version's number, from 1; above 1 after an edit." }
        kind: { $ref: "#/components/schemas/PromiseKind" }
        promisedDate: { type: string, format: date }
        promisedAmount:
          type: integer
          format: int64
          nullable: true
          description: Rupiah promised by the date; null means everything that was owed after payingNow.
        payingNow: { type: integer, format: int64, description: What the tenant said they pay right after saving. }
        createdAt: { type: string, format: date-time, description: When the newest version was saved. }

    TenantPromiseVersion:
      type: object
      required: [version, kind, promisedDate, promisedAmount, payingNow, outstandingAt, source, note, createdBy, createdAt, coveredInvoiceIds]
      properties:
        version: { type: integer, description: From 1. }
        kind: { $ref: "#/components/schemas/PromiseKind" }
        promisedDate: { type: string, format: date }
        promisedAmount:
          type: integer
          format: int64
          nullable: true
          description: Rupiah promised by the date; null means everything owed after payingNow.
        payingNow: { type: integer, format: int64 }
        outstandingAt: { type: integer, format: int64, description: What the tenant owed when this version was made. }
        source: { $ref: "#/components/schemas/PromiseSource" }
        note: { type: string, nullable: true }
        createdBy:
          description: The member who recorded it; null when the tenant made it on the payment page.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StaffRef"
        createdAt: { type: string, format: date-time }
        coveredInvoiceIds:
          type: array
          description: The invoices still owing when it was made, oldest period first.
          items: { type: string, format: uuid }

    ActivePromise:
      type: object
      required: [id, version, kind, promisedDate, promisedAmount, payingNow, source, note, createdBy, createdAt, coveredInvoiceIds]
      description: The newest version of a tenant's active payment promise, as staff see it.
      properties:
        id: { type: string, format: uuid, description: The promise's id (as in listTenantPromises). }
        version: { type: integer, description: "The newest version's number, from 1; above 1 after an edit." }
        kind: { $ref: "#/components/schemas/PromiseKind" }
        promisedDate: { type: string, format: date }
        promisedAmount:
          type: integer
          format: int64
          nullable: true
          description: Rupiah promised by the date; null means everything owed after payingNow.
        payingNow: { type: integer, format: int64, description: What the tenant said they pay right after saving. }
        source: { $ref: "#/components/schemas/PromiseSource" }
        note: { type: string, nullable: true, description: "The member's note; null when there is none." }
        createdBy:
          description: The member who recorded it; null when the tenant made it on the payment page.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StaffRef"
        createdAt: { type: string, format: date-time, description: When the newest version was saved. }
        coveredInvoiceIds:
          type: array
          description: The invoices still owing when the newest version was made, oldest period first.
          items: { type: string, format: uuid }

    TenantPromise:
      type: object
      required: [id, tenantId, status, createdAt, closedAt, versions]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PromiseStatus" }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true, description: When it stopped being active. }
        versions:
          type: array
          description: Every version, oldest first; the last one holds the terms now.
          items: { $ref: "#/components/schemas/TenantPromiseVersion" }

    TenantPromiseList:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TenantPromise" }

    PaymentPreviewItem:
      type: object
      required: [invoiceId, kind, unitLabel, propertyName, period, periodEnd, dueDate, balance, applied, balanceAfter, paidInFull]
      properties:
        invoiceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        unitLabel: { type: string, example: Kamar 11 }
        propertyName: { type: string, example: Kos Melati }
        period: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        balance: { type: integer, format: int64, example: 1250000, description: "What the invoice owes now, before this amount." }
        applied: { type: integer, format: int64, example: 250000, description: "What the amount would pay on it; always above 0." }
        balanceAfter: { type: integer, format: int64, example: 1000000, description: "What it would still owe; balance minus applied." }
        paidInFull: { type: boolean, description: True when the amount pays what the invoice owes ("Lunas"). }

    PaymentPreview:
      type: object
      required: [amount, outstandingBefore, outstandingAfter, items]
      properties:
        amount: { type: integer, format: int64, example: 1000000, description: "The amount previewed, as asked." }
        outstandingBefore: { type: integer, format: int64, description: "What the tenant owes now over all their invoices." }
        outstandingAfter: { type: integer, format: int64, description: "What they would still owe after paying amount." }
        items:
          type: array
          description: The invoices the amount reaches, oldest period first; the last may be paid in part.
          items: { $ref: "#/components/schemas/PaymentPreviewItem" }

    CreateQrisRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          example: 700000
          description: Whole rupiah to pay with this QR. Errors use field amount.
    QrisStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, checking, paid, expired]
          description: >
            none: no QR yet. pending: the QR can be paid. checking: the tenant said they paid and
            no answer has come yet. paid: the attempt was paid. expired: the QR expired or was
            cancelled; the tenant makes a new one.
        amount:
          type: integer
          format: int64
          description: The latest attempt's amount in rupiah; absent when status is none.
        expiresAt:
          type: string
          format: date-time
          description: When the latest attempt's QR expires; absent when status is none.
        checkedAt:
          type: string
          format: date-time
          description: >
            When the tenant said they paid ("Saya sudah bayar"); present only while status is
            checking.
